# Foundry — Dokploy deployment.
#
# Routing is handled by Dokploy's Domains UI (Service Name = foundry, Container
# Port = 8080), so this compose carries NO Traefik labels — Dokploy injects them
# itself, and having our own too caused conflicting routers (a 404 on every
# domain, including the demo one).
#
# The foundry_data volume holds everything you create and survives redeploys.
services:
  foundry:
    build: .
    restart: unless-stopped
    environment:
      FOUNDRY_PASSWORD: "${FOUNDRY_PASSWORD:-change-me}"
      FOUNDRY_SECRET: "${FOUNDRY_SECRET:-change-me-long-random}"
      PORT: "8080"
    volumes:
      - foundry_data:/app/data
      - foundry_dist:/app/dist

volumes:
  foundry_data:
  foundry_dist:
