# Foundry — Dokploy deployment (Traefik-routed on dokploy-network).
#
# The persistent volume foundry_data holds everything you create and survives
# every redeploy. The Traefik labels are what make the custom domain resolve —
# without them Dokploy's proxy has no route and returns a 404 + self-signed cert.
services:
  foundry:
    build: .
    restart: unless-stopped
    environment:
      FOUNDRY_PASSWORD: "${FOUNDRY_PASSWORD:-change-me}"
      FOUNDRY_SECRET: "${FOUNDRY_SECRET:-change-me-long-random}"
      PORT: "8080"
    volumes:
      - foundry_data:/app/data
      - foundry_dist:/app/dist
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP
      - traefik.http.routers.foundry-web.rule=Host(`eng.affmeet.com`)
      - traefik.http.routers.foundry-web.entrypoints=web
      # HTTPS + Let's Encrypt
      - traefik.http.routers.foundry.rule=Host(`eng.affmeet.com`)
      - traefik.http.routers.foundry.entrypoints=websecure
      - traefik.http.routers.foundry.tls.certresolver=letsencrypt
      # the internal port the app listens on
      - traefik.http.services.foundry.loadbalancer.server.port=8080

networks:
  dokploy-network:
    external: true

volumes:
  foundry_data:
  foundry_dist:
