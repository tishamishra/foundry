niche: fire-damage
label: Fire & Smoke Damage Restoration
schema_type: GeneralContractor
services:
- slug: emergency-board-up
  name: Emergency Board-Up
  summary: The building secured and weatherproofed the same day.
- slug: smoke-soot-removal
  name: Smoke & Soot Removal
  summary: Surface-by-surface cleaning matched to what actually burned.
- slug: odour-treatment
  name: Odour Treatment
  summary: Sealing and treatment of the materials holding the smell, not just the air.
- slug: contents-cleaning
  name: Contents Cleaning
  summary: Salvageable belongings inventoried, cleaned and returned.
- slug: structural-repair
  name: Structural Repair
  summary: Rebuild of what the fire and the water used to fight it took out.
- slug: damage-assessment
  name: Damage Assessment
  summary: A written, photographed assessment written the way an adjuster needs to read it.
