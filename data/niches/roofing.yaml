niche: roofing
label: Roofing
schema_type: RoofingContractor
services:
- slug: roof-repair
  name: Roof Repair
  summary: Targeted fixes for leaks, storm damage and worn flashing, without replacing a roof that still
    has life in it.
- slug: roof-replacement
  name: Roof Replacement
  summary: Full tear-off and replacement when repairs stop being economical, with the deck inspected before
    anything new goes down.
- slug: storm-damage
  name: Storm Damage Repair
  summary: Fast response after wind, hail or fallen limbs, including temporary cover and documentation
    for your claim.
- slug: roof-inspection
  name: Roof Inspection
  summary: A written condition report on what is failing, what has life left, and what it will take to
    keep the water out.
- slug: gutter-installation
  name: Gutter Installation
  summary: Sizing, pitch and downspout placement that moves water away from the foundation instead of
    into it.
- slug: commercial-roofing
  name: Commercial Roofing
  summary: Flat and low-slope systems for small commercial buildings, scheduled around the business using
    them.
