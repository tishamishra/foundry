niche: water-damage
label: Water Damage Restoration
schema_type: GeneralContractor
services:
- slug: emergency-water-extraction
  name: Emergency Water Extraction
  summary: Standing water removed fast, before it reaches the structure and the contents.
- slug: structural-drying
  name: Structural Drying
  summary: Monitored drying of framing, subfloor and cavities, with readings recorded daily.
- slug: burst-pipe-cleanup
  name: Burst Pipe Cleanup
  summary: Containment, extraction and repair of the damage a failed supply line leaves behind.
- slug: storm-flood-recovery
  name: Storm & Flood Recovery
  summary: Category-appropriate cleanup after external water enters the building.
- slug: sewage-cleanup
  name: Sewage Backup Cleanup
  summary: Contaminated-water response with the containment and disposal that category requires.
- slug: moisture-inspection
  name: Moisture Inspection
  summary: A written moisture map showing what is wet, how wet, and what it threatens.
