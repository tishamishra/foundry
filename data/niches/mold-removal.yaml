services:
- slug: mold-inspection
  name: Mold Inspection
  summary: Where it is, how far it has spread, and what is feeding it.
- slug: mold-remediation
  name: Mold Remediation
  summary: Containment, removal and disposal under controlled conditions.
- slug: crawlspace-mold
  name: Crawl Space Mold Treatment
  summary: The commonest source in a house nobody looks at.
- slug: air-quality-testing
  name: Air Quality Testing
  summary: Sampling before and after, so the result is measured rather than asserted.
- slug: moisture-source-repair
  name: Moisture Source Repair
  summary: Removal without fixing the water is a repeat visit; we find the source.
- slug: post-remediation-clearance
  name: Post-Remediation Clearance
  summary: Written clearance documenting what was done and what was verified.
