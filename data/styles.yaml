# STYLE PACKS — how a page LOOKS. Nothing here decides what sections exist or in
# what order; that is the skeleton's job (data/skeletons.yaml).
#
# Splitting the two is what makes them multiply. Sixteen packs x six skeletons
# x ten themes is 960 combinations over one hand-authored stylesheet, and none
# of them needs a template or a build step.
#
#   hero      split | stacked | banner | overlay | minimal | slab | card | frame
#   cards     outline | raised | flat | edge | line | tint | soft | plate
#   headline  serif | condensed | display | grotesk | mono | slab | light | wide
#   accent    none | underline | bar | highlight | dot | slash | box
#   rhythm    tight | comfortable | airy

classic:
  label: Classic
  hero: split
  cards: outline
  headline: serif
  accent: none
  rhythm: comfortable
  radius: "14px"
  display_font: "'Fraunces', Georgia, serif"
  body_font: "'Inter', system-ui, sans-serif"
  fonts_url: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"

