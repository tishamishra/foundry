service_intros:
- paras:
  - '{service} is one of the jobs {company} does most[[ around {city}]], and it is usually more contained than people
    fear.'
  - The work starts with finding out exactly what failed and why. Once that is established you get a written scope
    with a price against it, and nothing outside that scope happens without a conversation.
- paras:
  - 'When people call about {service_lower}, the underlying question is nearly always the same: is this a small
    problem or a large one?'
  - That is answerable, but only from a proper look. {company} inspects first, reports in writing with photographs,
    and prices the work that the inspection actually supports.
  - Sometimes the honest answer is that it can wait. We would rather say that and be called again later.
- paras:
  - '{company} approaches {service_lower} the same way every time: understand the failure, size the response to
    it, document both.'
  - That sounds obvious. It is not what usually happens, which is why so much gets replaced when a part needed attention,
    and so much gets patched when the underlying problem was already there.
  - You will see the evidence either way before you are asked to decide anything.
- paras:
  - '{service} sits where a small maintenance job and a large capital one meet, and which side you are on depends
    on details you cannot see from where you are standing.'
  - So {company} looks properly first[[ at your {city} property]]. The inspection is written up whether or not the
    work goes ahead.
- paras:
  - There is no clever version of {service_lower}. It is careful diagnosis, correct materials and unhurried workmanship,
    in that order.
  - '{company} works to that sequence and writes down each stage, which is the only reliable way to tell afterwards
    whether it was done properly.'
  - Call {phone} and describe what you are seeing, and we will tell you the likely causes before committing you
    to anything.
- paras:
  - Most {service_lower} jobs are decided in the first twenty minutes on site.
  - That is where you find out whether the problem is contained, spreading, or already past the point where a repair
    makes sense. Each is a different job with a different number attached.
  - '{company} does not quote until that is settled, which is why the first visit is an inspection rather than a
    sales call.'
- paras:
  - '{company} treats {service_lower} as a documentation job as much as a physical one.'
  - Photographs before, a written scope, photographs after, and a note of materials. The physical work is the easy
    half.
- paras:
  - For {service_lower}, the useful question is not 'how much' but 'how far has it gone'.
  - '{company} answers that first[[ for properties across {county}]], in writing, and prices against the answer
    rather than against the worst case.'
- paras:
  - '{service} is the kind of job where the difference between a good outcome and a bad one is decided before any
    tools come out.'
  - '{company} spends the time on that part. It makes the quote slower to arrive and much more likely to be right.'
- paras:
  - People often call about {service_lower} after somebody else has already had a go at it.
  - 'That is fine, and it changes the first step: we work out what was done, what it addressed, and what it did
    not. {company} will tell you honestly if the previous work was sound.'
- paras:
  - '{company} carries out {service_lower} to a written scope, on an agreed date, with one crew from start to finish.'
  - Everything about that sentence is deliberate. Each part of it is something people tell us went wrong last time.
- paras:
  - The honest range on {service_lower} is wide, because it depends on what turns out to be behind the problem.
  - That is exactly why {company} inspects before quoting. You get photographs, a written scope, and a price that
    matches the scope rather than the worst case.
- paras:
  - '{service} rewards patience at the diagnosis stage and punishes it nowhere else.'
  - '{company} front-loads the looking, then works quickly once the scope is agreed[[ — including on jobs in {city}]].'
- paras:
