  - Ask us to walk through it and we genuinely will, in as much detail as is useful to you, and it is the kind of
    detail that rarely shows up on an invoice but consistently shapes how smoothly the actual visit ends up going,
    and that is close to standard practice on jobs like this.
- paras:
