  - Documentation on a {service_lower} job protects both sides of the arrangement, not just the customer. A dated,
    photographed record of what was found and what was done is exactly what lets {company} stand behind the work
    later, and it is what you would want if anything needed revisiting.
  - That record is as useful to {company} as it is to you — it is a great deal easier to stand behind a piece of
    work that was properly documented than one that was only remembered.
  - It is considerably easier to stand behind a piece of work that was properly documented at every stage than one
    that only exists as a memory of how the day went.
- paras:
  - The exclusions list on a {service_lower} quote is not small print — it is the part that tells you what could
    still change the price. {company} writes it in plain language and talks through it before you sign anything,
    because ambiguity in that list nearly always resolves in the contractor's favour if it is left vague.
  - Ambiguity in that list nearly always resolves in the contractor's favour if it is left vague, which is exactly
