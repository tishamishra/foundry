signs:
- text: A problem that changes after every bad spell is active. One that has looked identical for years is usually
    historic and worth watching rather than panicking about.
  title: It is getting worse, not staying the same
- text: If somewhere has been patched twice, the patch is not the problem — the diagnosis was.
  title: The same spot has been repaired before
- text: Intermittent usually means conditions-driven, which is a useful clue about where to look.
  title: A smell that comes and goes
- text: New noises are early warnings. They are also the cheapest stage at which to deal with anything.
  title: Something has started making a noise
- text: That narrows the cause considerably and is worth mentioning on the call.
  title: It only happens in certain weather
- text: Running costs drifting upward often points at something failing quietly rather than anything you did.
  title: A bill that has climbed without explanation
- text: The visible mark is where it emerged, not where it started. Those are frequently in different places.
  title: Staining that spreads
- text: Gradual decline is easier and cheaper to address than sudden failure, and it is the stage most people ignore.
  title: Something that used to work no longer does
- text: Worth diagnosing properly — the obvious explanation is right less often than you would think.
  title: Damp or condensation appearing indoors
- text: Anything that has changed shape needs looking at before it is covered up.
  title: Visible movement or a new gap
- text: Adjacent work is a common trigger and a useful piece of timing information.
  title: It was fine until work was done nearby
- text: Two confident and contradictory opinions usually means neither included enough looking.
  title: You have been told two different things
- text: Reluctance to show you the evidence is itself evidence.
  title: A previous contractor did not want to explain
- text: You know your property. If something changed, it is worth thirty minutes of somebody's time.
  title: Something looks fine but does not feel right
- text: The cost of waiting is real but it is rarely dramatic. Getting it assessed tells you which case you are
    in.
  title: It has been on the list for two years
- text: A written assessment before the survey is one of the more useful hours you can spend.
  title: You are about to sell or buy
- text: A mark that darkens or spreads with each downpour is active and worth a call. One that stays exactly the
    same size for months is usually historic — worth watching rather than panicking about. The difference matters,
    because the second one does not need anybody out this week, and treating it as urgent anyway usually just means
    paying for a visit that could have waited, and diverting attention from something in the property that actually
    is moving.
  title: A stain that grows after rain
- text: If the same area has been patched more than once and the problem keeps reappearing there, the patch was
    never the issue — the diagnosis behind it was. Something upstream of that visible spot is still doing whatever
    caused the first failure, and until that gets found, every repair in the same place is really just buying a
    bit more time on the same underlying cause. A second patch in the same place is usually a sign to stop patching
    and start diagnosing properly.
  title: A repair returning to the same spot
- text: An odour that comes and goes, rather than being constantly present, usually points to something conditions-driven
    — tied to weather, temperature, use, or time of day — which is a genuinely useful clue rather than just an unpleasant
    one. Mention exactly when it happens on the call, because that timing alone can narrow the likely cause considerably
    before anyone has even arrived. A smell that is always there, by contrast, tends to point somewhere more constant
    and worth checking sooner.
  title: A smell that only shows up sometimes
- text: Anything that has started making a noise it did not use to make is worth mentioning, even if it is not causing
    an obvious problem yet, because new sounds are often the earliest and cheapest stage at which something can
    be caught. By the time a sound turns into a visible symptom, the underlying issue has usually had time to get
    worse. Describing the sound as precisely as you can — when it happens, how loud, what triggers it — helps narrow
    things down fast.
  title: A new sound that wasn't there before
- text: A problem that only shows up during rain, cold snaps, heat, or wind is telling you something specific about
    its cause, and that pattern is worth mentioning on the phone rather than leaving out. Weather-linked symptoms
    narrow the likely explanation considerably compared to something that happens randomly or constantly. It is
    also worth noting roughly how bad the weather had to be before the symptom appeared, since that threshold is
    itself a useful piece of diagnostic information.
  title: Something that only happens in certain weather
- text: Running costs drifting upward over a season or two, without any change in how the property is being used,
    often points toward something failing quietly in the background rather than anything you have done differently.
    It is easy to assume rates simply went up, and sometimes they did. But a jump that outpaces the general trend
    is worth having looked at, because the alternative explanation is usually cheaper to fix the earlier it gets
    caught.
  title: A bill climbing without explanation
- text: A mark with a crisp, defined boundary usually points to a single, findable source nearby. One with a soft,
    diffuse edge that seems to grow outward in every direction is more often tracking moisture that has already
    travelled some distance before showing itself. That distinction changes where somebody should actually look
    first, and mentioning which kind you are seeing, along with roughly how the edge has changed over time, saves
    a genuine amount of diagnostic time on the visit.
  title: A sharp edge versus a spreading one
- text: A slow decline in performance, rather than a sudden stop, is easier and cheaper to address the earlier it
    gets caught, and it is also the stage most people are most likely to ignore because nothing has technically
    failed yet. By the time something stops working altogether, whatever caused the gradual decline has usually
    had months to get worse in the background. Mentioning when you first noticed the slowdown, even roughly, is
    more useful than it might seem.
  title: Something that gradually stopped working well
- text: Moisture showing up somewhere it did not used to is worth having looked at properly, because the obvious
    explanation — usually blamed on humidity or a recent shower — turns out to be the real cause less often than
    people assume. There is very often a more specific and more fixable reason behind it. Noting where exactly it
    appears, whether it is worse at particular times of day or year, and how long it has been happening all genuinely
    help with the diagnosis.
  title: Condensation or damp appearing indoors
- text: Anything that has visibly changed shape, opened up, or shifted out of alignment is worth having looked at
    before it gets covered, painted over, or otherwise hidden from view. Once it is concealed, establishing whether
    it is still moving becomes much harder, because there is no longer a clean mark to measure against. If you can,
    note the date you first noticed it and roughly its size, since that timeline is often more useful than the crack
    itself.
  title: A new gap, crack or shift
- text: A problem that appeared shortly after work was done nearby — on your property or a neighbouring one — is
    a useful piece of timing information and worth mentioning specifically, because adjacent work is a genuinely
    common trigger for things that then get blamed on unrelated causes. Vibration, changed drainage, altered ground
    conditions and disturbed structures can all produce delayed symptoms some distance from where the original work
    happened, which makes the timing clue more valuable than it might seem.
  title: It started right after work happened nearby
- text: If you have had confident, contradictory opinions from two different people about the same problem, that
    disagreement is itself informative — it usually means at least one of them, and quite possibly both, did not
    spend enough time actually looking before reaching a conclusion. A genuinely careful diagnosis tends to produce
    similar answers regardless of who does it, because it is grounded in specific evidence rather than a quick impression.
    Worth getting a third opinion focused specifically on the evidence, not the confidence.
  title: Two different opinions on the same thing
- text: If someone previously worked on the issue but was reluctant to actually show you what they found, or explain
    their reasoning when asked, that reluctance is itself a signal worth paying attention to. A contractor confident
    in their own diagnosis is usually happy to walk you through it, because the evidence supports the conclusion
    either way. One who avoids that conversation may have been working from a guess rather than a genuine finding,
    and it is worth having the area looked at again properly.
  title: A contractor reluctant to show you
- text: You know your own property better than anyone visiting it once ever will, and if something feels different
    even though nothing looks obviously wrong, that instinct is worth acting on rather than dismissing. People who
    live with a property notice subtle changes long before those changes become visible enough for a stranger to
    spot on a single visit. It usually costs very little to have someone take a proper look, and the alternative
    — ignoring a correct instinct — can cost considerably more later.
  title: It looks fine but feels wrong
- text: Something that has sat unaddressed on a mental list for a year or two, without getting noticeably worse,
    is often genuinely lower priority than it feels once it has been on the list long enough to cause a bit of guilt
    about it. But not always — some things stay quiet for years and then move quickly once a threshold is crossed.
    Getting it properly assessed at least tells you honestly which situation you are actually in, rather than continuing
    to guess.
  title: On the list for years
- text: A written, independent assessment before a sale goes through is one of the more useful hours you can spend,
    whichever side of the transaction you are on. Sellers get advance warning of anything a buyer's survey is likely
    to flag, with time to address it or price it in honestly. Buyers get a second set of eyes beyond the standard
    survey, focused specifically on the areas most likely to be glossed over in a generic report written for a wider
    audience.
  title: You are about to buy or sell
- text: A symptom that appeared or worsened after a change in how a space gets used — more occupants, a different
    routine, longer periods left empty — is often connected to that change rather than to age or coincidence, even
    when the timing is not immediately obvious. Increased use accelerates wear that would otherwise have stayed
    manageable for longer, and extended vacancy can allow small issues to go unnoticed until they have grown considerably.
    Mentioning the change in use on the call is genuinely useful.
  title: Changed with how the space is used
- text: A hairline mark that has not changed in months is usually cosmetic and safe to monitor rather than act on
    immediately. One that is visibly wider than it used to be, or has a step or offset where the two sides no longer
    line up flush, is a different category of problem and worth having looked at sooner rather than later. If you
    are unsure which you are looking at, a simple pencil mark and a date across it will tell you within a season.
  title: A static crack versus a growing one
- text: One odd symptom on its own is often nothing much. Several small, seemingly unrelated symptoms appearing
    within the same rough period — a smell, a sound, a slight change in performance — are more worth mentioning
    together than separately, because taken together they sometimes point toward a single shared cause that none
    of them would suggest in isolation. Describing the cluster as a whole, rather than calling about only the most
    obvious one, gives a much fuller picture to work from.
  title: Several small things at once
- text: A symptom that only appears when something is under more load than usual — more people in the space, sustained
    use, a busy stretch, extreme weather — but not during ordinary conditions, is telling you the underlying margin
    has narrowed even though everyday performance still looks fine. That kind of symptom is easy to dismiss because
    it is intermittent and only shows up occasionally, but it usually indicates something closer to a limit than
    a symptom that never varies at all.
  title: Something only shows up under heavier use
- text: Droppings, nesting material, gnaw marks or trails noticed incidentally while something else is being worked
    on are worth mentioning even though they were not what the visit was originally about, because pest activity
    discovered by accident is often more established than activity discovered because someone finally noticed it
    directly. An incidental finding like this is usually worth a proper look on its own terms rather than being
    treated as a footnote to whatever the original job happened to be.
  title: Pest signs found during other work
- text: A colour change on its own, with nothing else different — no smell, no texture change, no structural sign
    — is more often cosmetic than functional, and worth distinguishing clearly from a stain that comes with other
    symptoms attached. That said, colour alone is not a guarantee of harmlessness, particularly where it appears
    in a spot with a known history of trouble. Mentioning whether anything else has changed alongside the colour
    is the detail that actually helps sort a cosmetic issue from a real one.
  title: Discolouration with no other symptoms at all
- text: A symptom that appears to resolve on its own, only to return more pronounced a few weeks or months later,
    is a pattern worth flagging specifically, because a genuine, permanent resolution rarely looks like that. More
    often, something has temporarily stopped being visible — dried out, been covered, been masked by a change in
    conditions — while the underlying cause carried on unaddressed underneath. The return, when it comes, is usually
    a more advanced version of the same original problem.
  title: It cleared up, then came back worse
- text: Somewhere that used to feel firm and now gives slightly, feels softer underfoot or under pressure, or has
    developed a texture it did not have before, is worth having checked properly and fairly promptly. A texture
    change like that often means moisture, decay, or corrosion has been working somewhere out of sight for longer
    than the visible surface would suggest. It is one of the more reliable signs that a problem has already progressed
    past its earliest and cheapest stage.
  title: A texture change where it felt solid
- text: If a neighbour is dealing with something similar around the same time, that is worth mentioning, because
    a shared cause affecting several properties in an area — ground conditions, a wider weather event, shared infrastructure
    — points toward a different kind of diagnosis than an isolated, single-property problem does. It does not automatically
    mean your situation and theirs share a cause, but ruling that in or out early can meaningfully change where
    the assessment starts looking first.
  title: The neighbours have it too
- text: Something that used to do its job comfortably and now noticeably struggles to keep up, even though it has
    not stopped working outright, is worth mentioning specifically as a change in performance rather than simply
    as a general complaint. That distinction matters, because a struggling system that has not yet failed is usually
    a cheaper and more contained job than the same system after it has actually given out. Catching it at the struggling
    stage is genuinely worth the earlier phone call.
  title: A drop in performance
- text: Something spotted for the first time while doing a deep clean, moving furniture, or getting into a corner
    of the property that does not normally get much attention is worth flagging even if it looks like it has clearly
    been there a while. The fact that it went unnoticed for a period does not tell you much about how urgent it
    actually is — that requires an actual look — but mentioning how long the area has gone unexamined does help
    set proper context.
  title: Noticed while cleaning somewhere unusual
- text: A symptom confined strictly to one side of a boundary — always indoors and never outside, or the other way
    round — is a genuinely useful clue about where along the path the actual problem sits, because it rules out
    large portions of the system as the likely source. Mentioning that pattern specifically, rather than just describing
    the symptom itself, often lets an experienced eye narrow the likely cause considerably before they have even
    had a chance to look at it directly.
  title: Only indoors, or only outdoors
- text: If something sounds hollow, feels different underfoot, or otherwise behaves differently depending on exactly
    where you are standing when you notice it, that variation is a useful clue rather than something to ignore because
    it seems inconsistent. Mapping roughly where the difference starts and stops, even informally, helps narrow
    down the extent of whatever is actually happening underneath, and it is a detail well worth passing along before
    anyone arrives to have a proper, more thorough look at it.
  title: Different depending on where you stand
- text: Reaching the age where something in your property commonly starts to show problems, without yet showing
    any yourself, is not itself an emergency, but it is a reasonable trigger to have things checked rather than
    waiting for the first visible sign. Catching a typical failure before it actually happens is usually cheaper
    and considerably less disruptive than reacting once it already has. Age alone does not mean something is failing,
    but it is a sensible reason to schedule a proper look.
  title: Reaching the typical age, symptom-free
- text: Air movement somewhere it did not used to be — around a frame, a fitting, a joint — is worth mentioning
    even though it feels like a minor annoyance rather than a real problem. Draughts are often the first noticeable
    sign of a seal, gap or gasket that has failed, and they tend to arrive well before anything more visibly wrong
    follows. Noting exactly where you feel it, and whether it changes with wind direction, helps narrow down the
    source considerably.
  title: A new draught that wasn't there
- text: Something that used to open and close easily and now catches, sticks, or needs more force than it did is
    worth paying attention to, because it often means the frame or the surrounding structure has moved slightly,
    even by an amount too small to see directly. A single sticking door on its own is frequently nothing much. Several
    doors or windows changing around the same time, especially on the same side of the property, is a more useful
    pattern to mention.
  title: Doors or windows that now stick
- text: If something that used to do its job comfortably now seems to be working noticeably harder to achieve the
    same result — running longer, straining more, needing more input — that increased effort is itself a symptom
    worth reporting, even before anything actually stops working. It is easy to adjust to a slow change without
    consciously noticing it happened. Comparing roughly how things performed a year ago against how they perform
    now is a useful, if informal, way to catch it.
  title: Something working harder for the same result
- text: Corrosion appearing on metal that has always looked fine is worth mentioning specifically, because it usually
    points to moisture reaching somewhere it should not be able to, rather than simple age catching up with the
    material. A little surface rust on an old fitting is rarely urgent. Fresh corrosion on something recently installed,
    or spreading noticeably over a short period, is the kind of detail that changes how quickly it is worth having
    someone actually come and look at it.
  title: New rust on something that was clean
- text: Paint or a protective finish beginning to lift, bubble or peel is sometimes simply age catching up with
    a coating that was always going to need redoing eventually. It can also mean moisture is getting underneath
    it from somewhere, which is a different and more urgent problem entirely. The distinguishing detail is usually
    whether the peeling is even and general across a surface, which points to age, or localised to one patch, which
    more often points to a specific hidden cause.
  title: Paint or finish starting to peel
- text: Small amounts of grit, granules, flakes or sediment turning up somewhere they never used to collect is a
    genuinely useful early clue, because it usually means something upstream is shedding material as it wears, well
    before it fails outright. It is easy to sweep away and forget about, which is exactly why it tends to go unmentioned
    until the underlying wear has progressed considerably further. Keeping a small sample and noting roughly how
    much collects over a week is worth doing.
  title: Debris collecting somewhere it never did
- text: Standing water collecting somewhere that always used to drain away cleanly is worth having looked at fairly
    promptly, because pooling water rarely stays contained to where it first appears and tends to find its way into
    whatever is nearby given enough time. It can mean a blockage, a change in level, or a drainage route that has
    simply stopped working the way it should. Noting how long the water actually stands before it clears is a useful
    detail to mention.
  title: Water pooling where it never used to
- text: A section of floor or ground that has developed a noticeable dip, bump or unevenness compared to how it
    used to feel underfoot is worth mentioning, particularly if you can point to roughly when you first noticed
    the change. Small, gradual settling is common in many properties and is not automatically a sign of anything
    serious. A sudden change, or one that keeps getting more pronounced over a period of weeks, is a different and
    more urgent category of thing to report.
  title: A new dip or high spot underfoot
- text: A new vibration, felt through a floor, a fitting, or something running, is worth mentioning even if it is
    faint, because vibration is often one of the earliest physical signs that something has come slightly out of
    balance or alignment before it produces any other noticeable symptom. It is easy to get used to a vibration
    over a few days and stop consciously registering it. Noting when it started and whether it changes with use
    is genuinely useful information to pass on.
  title: A vibration that wasn't there before
- text: A patch of a room that has become noticeably colder or draughtier than the rest, without an obvious reason
    like a window being left open, is worth mentioning specifically rather than folding it into a general comment
    about the room feeling chilly. Localised cold spots often point to something behind the surface rather than
    the room as a whole, which is a different kind of problem with a different kind of fix than simply feeling under-heated
    on a cold day generally.
  title: A new cold spot in one room
- text: Small patches of mould or mildew appearing on a surface that has always stayed clean before are worth acting
    on rather than simply cleaning off and forgetting about, because the surface growth is usually a symptom of
    a moisture problem happening somewhere behind or beneath it. Cleaning the visible patch treats the symptom you
    can see and leaves the actual source untouched, which is why it tends to return within weeks if the underlying
    cause is never actually addressed properly.
  title: Mould or mildew on a surface
- text: A surface wearing unevenly — more worn on one side than the other, or in a pattern that does not match how
    it is actually used — is a useful clue rather than simply a cosmetic annoyance, because uneven wear often points
    to something structural or mechanical underneath that is not distributing load or use the way it was originally
    designed to. Even wear across the whole surface, by contrast, is usually just ordinary age catching up with
    something used consistently.
  title: Wear that's uneven across a surface
- text: A stain, damp patch or other sign that only shows up specifically after heavy weather, and not during ordinary
    rain or everyday use, is a useful detail worth mentioning precisely because of its specificity. It suggests
    a threshold is being crossed only under particular conditions, which narrows down the likely cause considerably
    compared with something that appears constantly or randomly. Noting how severe the weather had to be before
    the mark appeared helps establish how close to that threshold things currently sit.
  title: A mark that only appears after storms
- text: If an explanation for a problem sounds suspiciously tidy — a single, simple cause that accounts for absolutely
    everything you have noticed with no loose ends at all — it is worth a second look rather than automatic relief,
    because real problems in a property are frequently a little messier than that. A genuinely careful diagnosis
    usually leaves at least one detail slightly unexplained or flagged as uncertain, rather than a story polished
    enough to close every question in one go.
  title: An explanation that's too neat
- text: A problem that seems to resolve in one spot only to reappear somewhere nearby, rather than staying fixed
    in a single location, is telling you that the actual source has not yet been found — something is travelling
    before it shows itself, and each new location is just the latest place it happened to surface. Chasing the visible
    symptom from spot to spot without ever tracing it back to its origin is one of the more expensive patterns in
    this trade.
  title: A symptom that keeps moving location
- text: A surface that used to sound solid and now sounds hollow when walked on, tapped, or pressed is a genuinely
    reliable early sign that something underneath has begun to separate, decay, or lose its bond, well before any
    visible damage appears on top. It is one of the more useful things you can check yourself with nothing more
    than your own hands or feet, and it is worth doing periodically in areas with a known history of trouble.
  title: A hollow sound underfoot
- text: Comparing how something looks now against a photograph or a clear memory from a year or two ago is one of
    the simplest and most reliable ways to catch a slow change that would otherwise be too gradual to notice day
    to day. Most people underestimate how much can shift over twelve months precisely because they were present
    for every small step of it. If you have old photographs of the area in question, they are worth digging out
    before the visit.
  title: Different from how it looked last year
- text: A minor, recurring annoyance that used to happen occasionally and now happens noticeably more often — a
    jam, a squeak, a delay, a small failure that clears itself — is worth reporting as a pattern rather than dismissed
    each time as a one-off inconvenience. Increasing frequency, even of something individually trivial, usually
    means whatever is causing it is progressing steadily in the background. Mentioning roughly how the frequency
    has changed over recent months is more useful than describing the latest incident alone.
  title: A nuisance happening more often than before
- text: A gap, crack or join that appears to widen in one season and close up again in another is often just ordinary
    expansion and contraction with temperature or moisture, which is normal in many materials and not automatically
    a cause for concern on its own. What is worth watching for is whether it fully closes each time or whether,
    over successive cycles, it settles a little wider than it was the season before — that trend is the part that
    actually matters.
  title: A seasonal gap that opens and closes
- text: A mark that only appears after a particular activity — a shower running, an appliance cycling, a specific
    room being used a certain way — rather than showing up randomly or constantly, is a genuinely useful clue about
    where to look first. It suggests the cause is directly tied to that specific use rather than a general, ongoing
    issue. Mentioning exactly which activity precedes the mark, and roughly how soon afterward it appears, narrows
    the likely cause considerably before anyone arrives.
  title: A stain that only follows specific use
- text: Sometimes nothing looks any different at all, but something smells different than it used to — muskier,
    sharper, simply not the smell you associate with that part of the property. Smell often changes before anything
    becomes visible, because it can pick up on moisture, decay or material breakdown happening out of sight well
    before it produces a stain or a mark anyone could actually see. It is easy to dismiss a change you cannot point
    to visually, and worth mentioning anyway.
  title: A smell that's changed, not a look
- text: A part of the property that has always run slightly colder or damper than the rest is not necessarily a
    problem on its own — some spots simply are, for reasonable structural reasons. What is worth mentioning is whether
    that longstanding cold spot has become noticeably more pronounced recently, because a gradual worsening of an
    old, familiar quirk is a different and more informative signal than the quirk simply continuing to exist the
    way it always quietly has.
  title: A cold spot getting more noticeable
- text: Actually seeing a pest moving through the property, rather than just finding indirect signs like droppings
    or gnaw marks after the fact, generally indicates a more active and more established presence than indirect
    evidence alone would suggest. A live sighting is worth mentioning specifically, along with roughly when and
    where it happened and whether it has happened more than once, because that pattern of frequency and location
    is usually more useful than the sighting itself in narrowing things down.
  title: Live pests seen, not just droppings
- text: A recurring minor issue that gets fixed each time it comes up, only to return again a few months later in
    a slightly different form, suggests the actual underlying cause has never really been addressed, only the latest
    symptom of it. Each individual patch might genuinely have worked as intended at the time. The pattern of needing
    to keep doing it is the real signal, and it is worth having someone look at the whole picture rather than the
    latest occurrence alone.
  title: A nuisance that keeps getting patched
- text: A problem that only becomes visible from a specific vantage point — from a neighbouring property, from inside
    a cupboard, from underneath something rarely moved — often means it has been developing for a while in a spot
    nobody happened to be looking at directly. Discovering it now does not necessarily mean it just started; it
    likely means it simply became visible now. It is worth mentioning how the discovery happened, since that context
    helps establish how long it may have been present.
  title: Something only visible from one angle
- text: A noise that was faint when first noticed and has become noticeably louder or more frequent since is a more
    urgent pattern than a sound that appeared once and has stayed exactly the same ever since. Escalation over time
    usually means whatever is causing the noise is continuing to progress, rather than having settled into a stable,
    harmless state. Noting roughly how quickly the change has happened — over days, weeks, or months — is genuinely
    useful information to pass along.
  title: A sound that keeps getting louder
- text: If something was patched or touched up cosmetically at some point — painted over, filled, resurfaced — and
    that cosmetic layer is now visibly wearing away to reveal what is underneath, that is worth having looked at
    properly rather than simply touched up again in the same way. A cosmetic fix was, by definition, never meant
    to address whatever the underlying issue actually was, and its wearing through is really just the original problem
    becoming visible again after a pause.
  title: A cosmetic fix wearing through
- text: A problem that reliably gets worse around the same point every year — the first proper cold snap, the wettest
    month, the peak of summer heat — and then eases off again afterwards is worth mentioning as a recurring seasonal
    pattern rather than describing only the current occurrence in isolation. What is worth watching closely is whether
    each year's version is a little worse than the last, because that trend line matters more than any single season's
    severity on its own.
  title: Worse at the same time each year
- text: Where a symptom is noticeably worse on one side of a property than the other — one wall, one wing, one aspect
    — that asymmetry is a useful clue rather than just an odd coincidence, because it often points toward something
    specific to that side, such as sun exposure, prevailing weather, drainage, or the age of work carried out there
    compared with elsewhere. Mentioning the pattern explicitly, rather than just describing the worse side alone,
    gives more to work with.
  title: One side worse than the other
- text: If a tradesperson working on something unrelated, a surveyor, or even a visiting friend happens to mention
    something in passing that you had not personally noticed, that comment is worth following up rather than dismissing
    as somebody being overly cautious about a job that was not theirs to assess. An outside eye, even an informal
    one, often catches things that become invisible to somebody who sees the same property every single day and
    has simply stopped consciously noticing them.
  title: Someone else mentioned it in passing
