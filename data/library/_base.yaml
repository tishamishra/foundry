- paras:
  - What changes the price on a {service_lower} job partway through is almost always something hidden until work
    starts — a substrate that was not sound, a detail that was not visible until something was opened up. {company}
    names that possibility in the quote as an exclusion, so it is a known risk rather than a surprise.
  - Naming that possibility up front is the difference between a genuine surprise and a known risk that was simply
