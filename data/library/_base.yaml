why_us:
- text: The commonest expensive mistake in this trade is fixing the wrong thing well. We find the cause first.
  title: Diagnosis before pricing
- text: A small failure is a small job. It stops being one only when the evidence says so, and we will show you
    the evidence.
  title: Proportionate response
- text: What is included, what is excluded, and what would change the price.
  title: Scope in writing
- text: Before and after, supplied with the written report. Nobody should have to take our word about something
    they cannot see.
  title: Photographs from site
- text: The same people start and finish.
  title: One crew per job
- text: The honest week rather than the flattering day.
  title: Realistic timescales
- text: Access agreed, surfaces protected, waste removed. Small things, noticed by everyone.
  title: Tidy working
- text: If it has a few years left, that is what you will hear, along with what those years will likely need.
  title: Straight answers about age
- text: 'Written the way an adjuster needs to read it: dated, photographed and specific about cause.'
  title: Insurance-ready documentation
- text: You are told up front who will be on site and who they work for.
  title: No subcontracting surprises
- text: A number a person answers, for the duration.
  title: Reachable while it runs
- text: Some jobs need a different trade or a specialist. Saying so costs us a job and saves you a larger problem.
  title: We say no
- text: Urgency is real sometimes. It is also the easiest thing in this trade to manufacture, and we do not.
  title: We price the scope, not the panic
- text: Ambiguity always resolves in the contractor's favour, so we take it out before you sign.
  title: The quote names its exclusions
- text: If something else caught our eye, you get told and photographed, with no quote attached. You decide when.
  title: We flag what we are not pricing
- text: Findings, photographs, materials and dates — for your insurer, and for the next person to look at this.
  title: Documented, not just done
- text: We do not start something we cannot finish safely, and you hear about a change early.
  title: Weather and access beat the calendar
- text: Bring our written findings to anyone else. Work that only looks good unexamined is not work we want to do.
  title: Second opinions welcome
- text: The proof of most jobs is the first hard week after it. We check back.
  title: Follow-up after the first real test
- text: No jargon used to make a simple problem sound expensive.
  title: Plain language
- text: The commonest expensive mistake in this trade is fixing the wrong thing well. We find what is actually failing
    before we talk numbers, and we show you how we know, with photographs rather than a confident voice. A quote
    that arrives before anyone has looked properly is a guess with a number attached to it, and if you accept it,
    you are the one who ends up paying for the guess when it turns out to be wrong.
  title: Diagnosis before pricing
- text: A small failure gets a small job. It only becomes a larger one when the evidence on site says so, and we
    will show you that evidence rather than ask you to take our word for it. Plenty of this trade makes more money
    by starting every conversation with the biggest version of the job. We would rather start with the version the
    problem actually supports, even when that costs us the bigger number.
  title: Sized to match the problem
- text: Every quote states what is included and, just as importantly, what is not. That second part is where most
    disputes come from, so we settle it before any work starts rather than during it. If something outside the scope
    turns up once we begin, you are told and priced before it happens, not billed for it afterwards. Ambiguity in
    a written quote nearly always resolves in the contractor's favour, so we remove it in advance.
  title: Written scope with exclusions
- text: You get photographs of what we found, before anything is touched, and again once the work is finished. Most
    people never actually see the part of their property that failed, which is exactly where trust in this trade
    tends to break down. A photograph settles an argument that words cannot, and it means you are agreeing to a
    scope you can see rather than one you are being asked to imagine.
  title: Photographs from every visit
- text: The people who assess the job are the people who carry it out, and they stay on it until it is done. Handovers
    between crews are where details get lost, and on a job like this the details are most of what matters. It also
    means the person who spoke to you on the phone actually knows what happened on site, which saves everybody a
    great deal of repeated explanation later on.
  title: One crew, start to finish
- text: We would rather give you an honest week than a convenient day we cannot actually hold. Most complaints in
    this trade are not about the standard of work at all — they are about a date that moved and nobody thought to
    mention it. If something changes on our end, you hear about it as soon as we do, and clearing that low bar consistently
    turns out to account for most of a good reputation.
  title: Realistic dates, not flattering ones
- text: Flooring, planting, paths and parked vehicles get covered or moved before anyone starts work, and that is
    agreed with you in advance rather than discovered on the morning. It is a small thing to mention and an easy
    thing to skip, which is exactly why we mention it. A crew that protects the surroundings on a small job is the
    same crew you can trust on the parts of a larger one you cannot see.
  title: Protection for what surrounds the job
- text: If something has years left in it, that is what you will be told, along with a realistic sense of what those
    years will likely need from you. Selling a full replacement to someone whose problem is smaller is the easiest
    money in this trade, and also the fastest way to lose a customer permanently once they find out. We would rather
    keep you as a customer for the small jobs than lose you after one large one.
  title: Honest about how much life is left
- text: Findings are written the way an insurance adjuster actually needs to read them — dated, photographed, and
    specific about cause rather than vague about symptoms. That does not mean we handle your claim; the claim stays
    between you and your insurer. What we can do is make sure the paperwork on our side of it holds up to scrutiny,
    because a claim that gets queried on documentation is a slower claim for everyone involved.
  title: Documentation built for insurers
- text: You are told before work starts exactly who will be on site and who they work for, and that does not quietly
    change once the job is underway. If any part of the work genuinely needs a specialist, we say so up front and
    name them, rather than absorbing an unnamed subcontractor into a quote that implied it was all one crew. Knowing
    who is actually in your property is not a small courtesy — it is the baseline.
  title: Named crew, no substitutions
- text: While a job is running, there is a specific number for a specific person, and it gets answered rather than
    routed to a queue or a form that generates a ticket. Most frustration with contractors is not about the work
    itself — it is about not being able to reach anyone once the invoice has gone out or the crew has moved to the
    next job. We would rather you never need to find that out the hard way.
  title: A number that gets answered
- text: Some jobs need a different trade entirely, or a specialist we do not carry on staff, and taking them on
    anyway would mean doing them worse than someone else could. Saying so costs us the work and sends it somewhere
    better suited to it, which is a strange thing to advertise except that it is the honest description of what
    happens. There is enough of this trade's own work about without us also taking on somebody else's.
  title: We say no sometimes
- text: Real urgency exists, and when it does, we will say so plainly and explain exactly why. What we will not
    do is dress up an ordinary job as an emergency because urgency is the easiest lever in this trade to pull and
    the hardest one for a homeowner to argue against under pressure. If the honest answer is that it can wait a
    season, that is the answer you get, in writing, whether or not it costs us the job.
  title: We don't manufacture urgency
- text: Every quote states plainly what would change the price — hidden condition, extra scope, access that turns
    out harder than expected — before you have committed to anything. That is the opposite of how a quote is often
    used in this trade, where a low number wins the job and the exclusions surface once you are already partway
    through it. Reading a quote's exclusions tells you more about a contractor than the number at the bottom ever
    will.
  title: Exclusions named before you sign
- text: If something else catches our eye while we are on site, you get told about it and it gets photographed,
    with no quote attached and no pressure attached either. You decide when, or whether, that becomes a job in its
    own right. Bundling an unrelated concern into today's invoice because we happen to be there already is a pattern
    this trade is known for, and it is one we have deliberately built the process to avoid.
  title: Unrelated issues flagged, not quoted
- text: Findings, photographs, materials and dates go to you at the end of every job, not because it is required
    but because it is genuinely useful — to an insurer, a surveyor, a future buyer, or simply to the next contractor
    who has to work out what was done here before them. A property with a written history is easier and cheaper
    to maintain than one where every visit starts from a guess about what happened last time.
  title: A record for next time
- text: We do not start something we cannot finish safely and properly, even when the calendar says today is the
    day. If conditions mean a job should wait a day or a week, you hear about that change as soon as we know it
    ourselves, rather than discovering it when nobody turns up. A date pushed for a genuine reason, explained promptly,
    causes far less frustration than a date kept out of stubbornness and regretted afterwards.
  title: Scheduling that respects conditions over the calendar
- text: Take our written findings to anyone else you like and ask them to pull it apart. Work that only holds up
    when nobody else examines it is not work we are interested in producing, and a diagnosis that cannot survive
    a second pair of eyes was probably not a very careful diagnosis to begin with. We would rather you compared
    us properly on the evidence than chose us by accident because we answered the phone first.
  title: Second opinions are welcome, not resented
- text: The genuine proof of most jobs in this trade is not the day it finishes — it is the first bad week that
    follows, the first real test the work actually has to survive. We check back after that, unprompted, because
    a follow-up that only happens when something has already gone wrong is not much of a follow-up at all. Knowing
    someone is coming back to look is also, frankly, a reasonable incentive to do it properly first.
  title: We check back after the test
- text: A simple problem does not need technical language to sound expensive, and we try hard not to use it to make
    one sound that way. If a word needs explaining, we explain it there and then rather than letting it do the work
    of making the invoice look more serious. You should be able to read your own quote and understand exactly what
    you are paying for, without needing somebody else to translate it back into plain English for you.
  title: Plain language, not padded language
- text: Rather than simply telling you what needs doing, we show you why — what we found, what it usually means,
    and what would have to be true for a different conclusion to be right. That is the only way you can genuinely
    compare one quote against another, because two quotes with the same number can be based on completely different
    reasoning, and only one of them is likely to survive contact with what is actually behind the surface.
  title: Reasoning shown, not just a conclusion
- text: The manufacturer and product line used on your job go in writing with the quote, so you are never simply
    asked to trust that a reasonable product was used. You can look it up, compare it against alternatives, and
    ask us directly why we specified it over something cheaper or more expensive. A contractor who will not name
    what they are using is usually hoping you will not ask, and that is worth noticing before you sign anything.
  title: Materials you can look up yourself
- text: The visit itself is an assessment, not the opening move of a sales conversation, and the person who comes
    out is not working to a target for how much they leave with signed. If the honest answer to your call is a small
    job or no job at all, that is what you get told, because the point of the visit is an accurate answer, not a
    bigger invoice than the problem in front of us actually justifies.
  title: No upsell built into the callout
- text: Whoever takes your call, assesses the job, and quotes it is reachable through the whole thing, rather than
    handing you off to a different name at every stage. That continuity matters more than it sounds, because half
    of what goes wrong on a job comes from information getting lost somewhere between the person who understood
    the problem and the person actually doing the work. Keeping one person across the whole job removes most of
    that risk entirely.
  title: The same person from call to invoice
- text: The written assessment is yours regardless of what you decide to do with it. If you take it and get three
    other quotes, or fix it yourself, or simply file it away for later, that is entirely your call and it costs
    you nothing extra to make it. A survey that only exists to sell you the surveyor's own work is not really a
    survey. We would rather it stood on its own, because that is what makes it worth trusting.
  title: Findings stand on their own
- text: The temptation in this trade is to spend as little time as possible on the part that does not directly bill
    — the looking — and as much time as possible on the part that does. We deliberately do the opposite, because
    a rushed assessment is where the wrong thing gets fixed confidently, and confidence in the wrong diagnosis is
    far more expensive to unwind later than a slower, more careful first visit ever was to begin with.
  title: We won't rush the looking
- text: We keep crews small and keep them working together over time, which is unfashionable in a trade that often
    prefers to scale by adding unfamiliar hands to a job. Familiar crews communicate faster, catch each other's
    mistakes earlier, and need less supervision to hit the same standard. It also means the crew arriving at your
    property has usually worked together on dozens of similar jobs before, rather than meeting properly for the
    first time on yours.
  title: Small crews, kept together
- text: Some things genuinely cannot be known until work has started and something is opened up, and we say that
    plainly rather than pretending the quote covers every eventuality when it cannot. Those uncertain areas are
    named as exclusions, with an honest range of what they could add, rather than left silent and sprung on you
    later as a surprise number. Certainty we do not actually have is not something we are willing to pretend to
    for the sake of a tidier-looking quote.
  title: What's unknown gets said as unknown
- text: A quote from us is written to be read carefully later, not skimmed quickly and signed under pressure on
    the day. It states the scope, the exclusions, the materials and the price in plain terms, with nothing designed
    to expire by tomorrow or to make delay feel risky. If it needs a persuasive pitch attached to get you to sign
    it, that usually means the number is not standing on its own merits, and ours is meant to.
  title: A quote, not a pitch
- text: Sometimes the honest answer, after a proper look, is that nothing needs doing yet — not this year, and possibly
    not for several more after that. That is a genuine outcome of an assessment, not a failure to find work, and
    you get it in writing exactly as you would get a scope and a price. We would rather be the contractor who told
    you the truth for free than the one who invented a job to justify the visit.
  title: We'll tell you to leave it
- text: A photograph is useful but it does not capture everything — sound, smell, the give underfoot, the way something
    moves when pressed. Where the evidence is something you had to be there to notice, we describe it plainly rather
    than letting the photographs do all the talking on their own. A written assessment that only relies on pictures
    leaves out exactly the details that are hardest to fake and most useful for understanding what is actually happening.
  title: What the photos miss, we say
- text: If a previous contractor has already had a go at the problem, we look at what they did before we touch anything,
    and we will tell you plainly whether it was sound. That is sometimes an awkward conversation and we have it
    anyway, because pretending previous work was fine when it was not just sets the next person up to inherit the
    same failure. Understanding what was tried before is usually the fastest route to understanding what actually
    needs doing now.
  title: Honest review of someone else's work
- text: Some jobs only make sense in a particular order, and if yours needs another trade to finish first, we will
    tell you that clearly rather than start work that has to be partially undone later. Getting the sequence wrong
    is one of the more expensive mistakes a property owner can make without realising it, because it usually means
    paying twice for the same section. We would rather delay the start of our part than let you make that mistake.
  title: Told when another trade goes first
- text: What went into your job is recorded specifically enough to be useful years later — manufacturer, product
    line, and where it applies, the batch — rather than described generically as though any equivalent product would
    do. That record is what lets a future repair match what is already there instead of guessing, and it is what
    an insurer or a surveyor will actually ask for if the question of what was used ever comes up down the line.
  title: Materials recorded by name and batch
- text: A job is left safe at the end of every working day, not just once the whole thing is finished. Multi-day
    jobs create a window where the property is more exposed than usual, and that window gets closed each evening
    rather than left open until the crew returns. It is a small discipline that costs us a little time at the end
    of each day and saves you from ever having to worry about it overnight.
  title: The site made safe every evening
- text: Parking, access routes and anything neighbours need to know about are worked out before the first vehicle
    turns up, not negotiated awkwardly on the morning with somebody standing in the driveway. That conversation
    happens early enough that if something needs rearranging, there is actually time to rearrange it. A job that
    starts with a dispute over where to park rarely gets off to a good start on the parts of the work that matter
    more than parking does.
  title: Access agreed before the van arrives
- text: An assessment is not a sales call, and nobody is trying to get a signature before you leave the room. If
    you want a day, a week, or a second opinion before deciding anything, that is entirely reasonable and it changes
    nothing about the price or the findings you were given. A decision made under artificial pressure is rarely
    a good one, and we would rather you made a considered one, even if that means we hear back later.
  title: No pressure while you're deciding
- text: Something being old is not automatically the same as something being wrong, and we do not conflate the two
    just because it makes a stronger case for replacement. Age is one piece of evidence among several, and we weigh
    it against condition, not instead of it. Plenty of older installations are performing perfectly well, and telling
    you that honestly costs us a sale but keeps the relationship intact for the job that genuinely does need doing
    eventually.
  title: Age is not treated as failure
- text: When we say something is urgent, we explain specifically why — what is actively happening, what it is doing,
    and what happens if it continues unchecked — rather than simply attaching the word to the job and expecting
    you to take it on trust. A claim of urgency you cannot examine is really just pressure wearing a technical word.
    One you can examine is something you can actually make a decision about, which is the entire point of telling
    you at all.
  title: Urgency explained, not just declared
- text: We keep our own copy of what was found and what was done on your property, not just to close out the job
    but for years after, in case a question comes up later that neither of us anticipated at the time. That matters
    when something resurfaces after a long gap, or when a new owner needs to understand what was previously carried
    out. A record that only lives on your side of the relationship is only half a record.
  title: Records kept beyond the invoice
- text: A price given without anyone having actually looked at the property is a guess wearing the shape of a quote,
    and we will not put our name to one. Photographs sent over the phone can narrow things down and are genuinely
    useful for that, but they are not a substitute for someone standing in front of the problem. If you press us
    for a number before that has happened, the honest answer is that we do not have one yet.
  title: No quote without a look
- text: The likely causes we discuss with you on the phone are the same ones we go looking for when we arrive, not
    a different, more convenient story assembled once someone is standing in your property. If the on-site findings
    turn out to differ from what was discussed, you get told exactly how and why, rather than a quote that quietly
    moves the goalposts. Consistency between the phone call and the site visit is a small thing that is easy to
    fake badly.
  title: Phone call matches site visit
- text: The area you pointed at gets looked at, and so does everything immediately around it, because the two are
    very often connected in ways that are not obvious from where you are standing. A contractor working quickly
    will address the visible spot and move on. We would rather spend the extra time checking the adjoining details,
    because that is usually where the actual cause is quietly sitting, waiting to reappear somewhere else a few
    months later.
  title: Time spent on what's adjacent
- text: If a job takes longer than expected because of conditions, access, or simply the pace the work genuinely
    needs, the agreed price for the agreed scope does not move because of it. Running long is our problem to manage,
    not yours to pay for, provided the scope itself has not changed. That distinction — between a job that overran
    and a job that grew — is one we are careful to keep straight, and to explain clearly if it ever gets blurred.
  title: The scope holds if we run long
- text: A visit is priced as a visit, and if it turns into a job, the job is priced as a job — the two do not get
    quietly merged into one inflated number under the cover of urgency. Where an assessment does carry its own cost,
    that is stated plainly before anyone drives out, rather than surfacing afterwards attached to a story about
    how much trouble the visit apparently was. You should always know what a visit costs before it happens.
  title: No callout dressed up as urgent
- text: There is nearly always a version of a job that costs less and a version that costs more and lasts longer,
    and we will lay out both rather than steer you silently toward whichever one suits us better. Sometimes the
    cheaper option really is the sensible choice for your situation, and we will say so even though it is the smaller
    job for us. What we will not do is let you choose blind between two options you were never actually shown.
  title: The honest cost of cheap versus lasting
- text: There is no queue, no script, and no person reading from a screen who has never actually been on a job like
    yours this week. You call, describe the problem, and speak to someone who has recently done work similar to
    what you are describing and can talk about it properly. That matters more than it sounds, because a scripted
    response cannot tell the difference between your specific situation and the generic version it was written to
    handle.
  title: No call centre, no script
- text: If anything on the final invoice is unclear, we will go through it with you line by line until it is not,
    rather than treating a question about the bill as an inconvenience. Every item on it should trace back to something
    in the agreed scope or an exclusion you were told about along the way. An invoice nobody is willing to explain
    properly is usually an invoice with something in it that does not survive being explained properly.
  title: The invoice explained line by line
- text: Look first, agree a scope, then carry it out — that sequence does not change whether the job is a single
    afternoon or several weeks of work. It would be quicker, on the small jobs especially, to skip straight to doing
    the work, and it is tempting to when the problem looks obvious. We follow the same process anyway, because the
    jobs that go wrong are usually the ones where somebody decided the looking part could be skipped just this once.
  title: Same sequence, small job or large
- text: If a previous repair, product or approach clearly did not address the actual problem, we will tell you plainly
    rather than let you assume it must have helped somehow because it cost money. That is not a comfortable thing
    to hear and we say it anyway, because understanding what did not work is often the fastest way to understand
    what will. Pretending every past expense was worthwhile does you no favours when you are trying to decide what
    to do now.
  title: We'll say when money elsewhere was wasted
- text: The written findings, photographs and scope are not primarily there to protect us from a dispute, although
    they do that too. They are there so that you have an accurate, independent record of what your property actually
    needed at a given point in time, which is useful well beyond the life of this particular job. A record built
    only to cover the contractor is a different document from one built to actually be useful to the property owner.
  title: Documentation protects you as much as us
- text: If something on our side of a job was wrong — a measurement, a material, a piece of the scope — we say so
    and put it right, rather than defending the decision because admitting it costs us something. Everybody in this
    trade makes mistakes occasionally; the difference is in what happens next. We would rather be the contractor
    who fixed it without an argument than the one who spent longer arguing about it than the fix itself would have
    taken.
  title: Our own mistakes get owned, not argued
- text: If something you had worked on resurfaces, or a new symptom appears somewhere you have not called about
    before, that call gets the same attention as a first one, not a slightly defensive one because it implies the
    earlier job did not hold. Sometimes a repeat call is unrelated to the earlier work entirely, and sometimes it
    is not, and either way the honest answer matters more to us than protecting the reputation of the previous visit.
  title: Repeat calls aren't treated as a nuisance
- text: If waiting is a genuine option, we will also tell you honestly what waiting tends to cost — not to scare
    you into acting sooner, but so the decision to wait is an informed one rather than an accidental one. Some delays
    cost nothing at all. Others quietly turn a repair into a replacement over the course of a season, and knowing
    which situation you are actually in is worth more to you than any pressure we could apply either way.
  title: What a delay is likely to cost
- text: Something that looks bad and something that is actually failing are not automatically the same problem,
    and treating every visible flaw as a structural one is a fast way to overcharge somebody for a purely cosmetic
    fix. We separate the two explicitly in the written findings, so you can decide how much of the cosmetic side
    is worth addressing now, later, or not at all, without that decision being clouded by an implied urgency the
    underlying problem does not actually have.
  title: Cosmetic and structural, kept separate
- text: Trades overlap more than people expect, and it is tempting to take on adjacent work simply because we are
    already on site and it would be convenient billing. Where a job genuinely sits outside what we do well, we say
    so and point you toward someone who does it properly, rather than stretching to cover it ourselves. A referral
    we make nothing from is a strange thing to be proud of, and it is still the right call every time.
  title: We refer out what we shouldn't touch
- text: The number of people sent to your job reflects what the job actually needs, not what maximises the day rate
    on the invoice. A two-person job does not get padded to three, and a job that genuinely needs more hands gets
    them rather than being left understaffed to save on labour. Matching crew size honestly to scope is one of those
    decisions nobody outside the trade can easily audit, which is exactly why it matters that we hold ourselves
    to it.
  title: Crew size matched to the job
- text: What you are billed for is what was agreed in writing before work started, plus anything additional that
    was explicitly discussed and priced along the way — nothing else appears on the final number by surprise. If
    the agreed scope changes, you hear about it and agree to the new number before it is carried out, not after.
    An invoice that matches the quote it grew from is a low bar, and it is one worth insisting on regardless.
  title: The invoice matches the agreed scope exactly
- text: How a crew behaves once the visible part of the job is finished — clearing waste, checking surfaces, tidying
    the last corner nobody was watching — tells you more about their standards than the main event of the work itself
    does. We treat the last twenty minutes on site with the same care as the first twenty, because it is easy to
    let that slip once the interesting part of the job is already behind everyone involved.
  title: Cared for right to the end
- text: If something occurs to you after we have left and the invoice is settled, you can still call and ask, and
    it gets a proper answer rather than a sense that the relationship ended the moment payment cleared. Documented
    work with named materials is straightforward to revisit months later precisely because we kept a proper record
    of it. That is as much a practical convenience for us as it is a courtesy for you, and we do not pretend otherwise.
  title: Questions answered after the invoice is paid
- text: When we say something has been made safe rather than permanently fixed, we explain exactly what that distinction
    covers and what it does not, so you are not left assuming a temporary measure is a finished job. Interim work
    has a clear purpose and a clear limit, and pretending otherwise just to close out a visit tidily would leave
    you with a false sense of where things actually stand until the permanent work can be properly scheduled and
    carried out.
  title: What 'made safe' actually means, explained
- text: 'Every assessment ends with one of three honest conclusions: this needs doing now, this can reasonably wait,
    or this does not need doing at all. All three get treated as equally legitimate outcomes of the visit, not just
    the first one, which is the only one that generates an immediate invoice. A contractor whose assessments only
    ever arrive at the first conclusion is not really assessing anything — they are pricing a decision that was
    made before they ever looked.'
  title: Now, later, or never
- text: Nobody who comes out to your property is working toward a target for how much additional work they bring
    back, and that changes the incentive on the ground more than any amount of good intention would on its own.
    The point of the visit is an accurate answer to the question you called about. Anything else that genuinely
    needs attention gets mentioned honestly, but it is mentioned because it is true, not because mentioning it earns
    anyone anything.
  title: Selling more is not the point
- text: Occasionally a repair does not hold as expected, usually because something underneath it turns out to be
    more compromised than the first look suggested. When that happens, we come back and work out why, at our expense
    where the shortfall was genuinely ours to own, rather than treating the return visit as a new job to bill separately.
    How a contractor handles the rare failure tells you more than how they handle the routine successes ever will.
  title: When the first fix doesn't hold
- text: The assessment is carried out the same way whether it is likely to lead to a large job, a small one, or
    nothing at all, because the quality of the looking should not depend on the size of the invoice it might produce.
    It would be easy, and tempting, to look harder at properties that seem likely to be worth more work. We would
    rather every visit got the same standard of attention, and we structure the process so that it does.
  title: The same look, regardless of outcome
- text: Pricing starts from the specific scope the assessment actually supports, not from a generic rate card applied
    regardless of what was found. Two jobs that look similar from the street can require very different amounts
    of work once you know what is actually behind the surface, and a rate-card price flattens that difference in
    whichever direction favours the contractor. We would rather the number reflect the job in front of us than a
    template built for an average one.
  title: Priced from what we found
- text: Doing things in the right order matters more than doing them quickly, and where the two conflict, we default
    to the order rather than the speed, even under pressure to hurry. Rushing a step out of sequence to look responsive
    is one of the more common ways this trade creates expensive problems it then has to fix a second time. We would
    rather explain a short delay honestly than skip a step and let you discover the consequences later.
  title: Sequence takes priority over urgency
- text: Where a genuine unknown exists — condition behind a surface, the state of something buried, what a previous
    repair actually did — we say so plainly in the quote rather than presenting an estimate with false confidence.
    That unknown is named, along with a realistic sense of what it could mean for the price either way. A quote
    that admits its own uncertainty is more trustworthy than one that pretends to know everything before anything
    has actually been opened up.
  title: Guesswork named before it's opened up
- text: You are not passed between different names at each stage of the job — booking, assessment, quoting, the
    work itself, and any follow-up afterwards. One person stays with it, which means you are never explaining the
    same context to somebody new, and nothing gets lost in a handover that did not need to happen in the first place.
    That continuity is a small operational choice with a disproportionately large effect on how the whole experience
    actually feels.
  title: One person throughout, not a rotating queue
- text: Before the crew leaves, you get walked through what was done and where, so the invoice that follows describes
    work you have already seen and understood rather than work you are being asked to take on faith. That walkthrough
    is not a substitute for the written record — you get both. But seeing it in person, with someone able to answer
    questions on the spot, catches misunderstandings a written report alone would leave until it was too late to
    easily fix.
  title: A walkthrough before the invoice
