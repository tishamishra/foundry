    materials and eras, so the failure patterns repeat — and a fault that takes two hours to find on an unfamiliar
    roof takes twenty minutes on a familiar one.
  - 'Whatever the job turns out to be, it starts the same way: someone gets on the roof in {city} and looks properly
    before anybody talks about price.'
- paras:
  - Roofs in {city} take the same weather, and they tend to fail in the same places because of it.
