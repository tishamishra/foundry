  - Call {phone} and mention the claim on the first call so the visit is set up for it.
process_steps:
- text: Where the stain is, when it started, what the weather was doing. Often that narrows the cause before anyone
    drives out.
  title: You call and describe it
- text: 'An actual inspection: flashings, valleys, ridge, penetrations, and the loft or ceiling void where we can
    reach it.'
  title: We get on the roof
- text: Written, with photographs, describing what is failing and what is merely aged.
  title: You get the findings
- text: A specific list of work with a price against it, and a note of what would change that price.
  title: We agree a scope
- text: Booked around the weather, with the roof never left open overnight.
  title: The work happens
- text: Before the crew leaves, you see what changed and where.
  title: We walk it with you
- text: Findings, photographs, materials and dates, so the next person to look at this roof starts informed.
  title: You keep the record
- text: When several jobs land at once after a storm, active leaks go first. We will tell you honestly where you
    sit in that queue.
  title: Triage by water
- text: If the permanent fix has to wait for weather or materials, the roof gets made watertight in the meantime.
  title: Temporary cover if needed
- text: The real test of a roof repair is weather, so we check back after some.
  title: Follow-up after the first heavy rain
- text: So the state the roof was in is a record, not a memory.
  title: We photograph before anything moves
- text: Nothing outside it happens without a conversation and a number.
  title: You approve the scope in writing
- text: We never open more than we can make watertight the same day.
  title: The roof is closed every evening
- text: Manufacturer and product line in writing, so you can check it yourself.
  title: Materials are recorded by name
- text: Where the stain is, when it started, and what the weather was doing usually narrows the likely cause before
    anyone drives out to look. Whoever answers writes it down properly rather than trusting memory to carry it through
    to the visit itself. It is a short call, and it usually saves you a wasted visit later on.
  title: You call and describe it
- text: When several calls land at once after a storm, active leaks go to the front of the queue over cosmetic concerns
    entirely. You are told honestly where you actually sit in that order rather than a comfortable answer designed
    simply to end the call quickly.
  title: Triage by how much water is entering
- text: Scheduling gives a realistic span of time rather than a single flattering hour that rarely survives the
    day intact once other jobs run long. You are told plainly what could move it — the previous job, weather, access
    — before it becomes an excuse later.
  title: A window is agreed, not a promise
- text: An actual roof inspection covers the covering, flashings, valleys, ridge and penetrations, not just the
    section you pointed at over the phone, because the visible symptom and the actual entry point are frequently
    in quite different places on a real roof. You get a straight answer about what it actually found, before anything
    is written up formally.
  title: The inspection itself
- text: Wherever it is safely accessible, the underside of the roof gets examined too as a standard part of the
    visit, since a stain, a damp rafter or daylight through the boards often tells you considerably more than the
    covering does from outside alone. It is one of the more useful parts of the visit, even though it takes the
    least time.
  title: The loft or ceiling void checked
- text: Whatever is found gets photographed exactly as it is, before anything is disturbed or touched, so the state
    the roof was actually in becomes a genuine record rather than a memory anyone has to rely on days or weeks later.
    You get copies of these with the written findings once the assessment is finished.
  title: Photographs before anything moves
- text: A written report describes plainly what is failing and what is merely aged, with photographs attached throughout,
    so you can see exactly what the assessment is based on rather than being asked to take a verbal summary purely
    on trust. You can compare this against any other quote you already have, or simply sit with it.
  title: You get the findings in writing
- text: A specific list of work goes against a price attached to it, along with a plain note of what would change
    that price if something unexpected turns up once work actually begins. Nothing outside that list happens without
    a further proper conversation first. You are never asked to sign anything on the spot, and can take the time
    you need.
  title: A written scope gets agreed
- text: Work is booked against a genuine, usable stretch of dry weather rather than squeezed in against the calendar
    regardless of the forecast, because a tear-off genuinely has to close the very same day it opens up. You are
    told plainly if that window narrows before the date arrives, not on the morning itself.
  title: The weather window gets planned
- text: Deliveries and skip placement are planned with your access and your neighbours in mind well before the crew
    actually arrives, not worked out on the morning by whoever happens to be driving the lorry that particular day.
    Where each item goes is agreed with you in advance, not decided on the day itself.
  title: Materials and skip get delivered
- text: Scaffold, if it is needed for the job, goes up and gets properly checked before any tear-off begins, with
    planting, paths and vehicles near the working area protected as a matter of routine course rather than treated
    as an afterthought. This happens before any tool actually touches the roof, so the working area stays properly
    protected throughout.
  title: Access and staging get set up
- text: The old covering comes off in sections that can genuinely be closed the same day, rather than opening more
    roof than the schedule and the actual weather can realistically support finishing safely before evening arrives.
    Only as much roof opens at once as can genuinely be closed again before the crew leaves that evening.
  title: The tear-off begins
- text: Once the old covering is off, the deck is visible for the very first time, and you are told exactly what
    condition it is in, with photographs attached, before anything at all gets covered back over. Nothing gets covered
    back over until you have seen it and had the chance to ask about it.
  title: The deck gets inspected once exposed
- text: Underlayment goes down and the roof is made properly watertight before the crew leaves, every single evening
    the job runs for, regardless of exactly how far along the actual covering work has gotten by that point. This
    is the point at which the roof stops being vulnerable to whatever the forecast does next.
  title: Dry-in happens the same day
- text: Shingles, tiles, slate or membrane are installed to the specification you agreed to, working section by
    section in a sequence that keeps the roof genuinely closed at the end of every single working day throughout
    the job. Work proceeds in a sequence that always leaves the roof in a safe, closed state by evening.
  title: The new covering goes on
- text: Chimneys, valleys, walls and penetrations get their flashing fitted and sealed properly, one detail at a
    time and in careful order, because these are the joints where the roof will actually be tested by the very first
    real storm. This is slow, careful work, and it is where the roof will actually be tested by the next storm.
  title: Flashing gets dressed and sealed
- text: Capping goes on along the ridge and hip lines, bedded and pointed to a proper standard throughout, completing
    the covering precisely at the points most exposed to wind and weather on the whole roof. This is usually one
    of the last stages before the covering itself is considered complete.
  title: Ridge and hip get finished
- text: While access is already in place from the roofing work, gutters below the working area get cleared of debris
    from the job and checked properly for damage, since a roof leak sometimes turns out to be a gutter problem instead.
    Any debris from the job itself gets cleared out before the crew moves on to the next stage.
  title: Gutters and downpipes get checked
- text: Offcuts, old materials and packaging get cleared through the working day rather than left to pile up until
    the very end, and a magnet sweep of the ground below the working area happens before the crew is genuinely finished.
    This happens before the site is handed back to you, not left for a separate visit.
  title: Clean-up and the magnet sweep
- text: Before the crew actually leaves, someone walks the site with you specifically, pointing out exactly what
    changed and where on the roof, rather than assuming a tidy driveway and a packed van settle the matter entirely
    on their own. It is a short conversation, and it is the point where most remaining questions get answered directly.
  title: The final walk-round
- text: Findings, photographs, materials used and dates go to you directly before the crew leaves the property,
    in a form you can genuinely keep and file, rather than promised as a follow-up email that may or may not actually
    arrive. It includes what was found, what was done, and what materials were actually used throughout.
  title: You get the written record
- text: The real test of a roofing repair is weather rather than the day the scaffold comes down and everyone drives
    away, so we check back after the first significant rainfall to confirm everything is genuinely behaving as it
    should. It is a genuine check rather than a formality, and your answer shapes what happens next if anything.
  title: Follow-up after heavy rain
- text: If something is found mid-job that was not part of the original scope, you are told and shown a price before
    anything is carried out on it, never simply billed for after the fact as a surprise appearing on the final invoice.
    This is named as a possible scenario in the original written quote, not sprung on you unexpectedly.
  title: You approve any extra scope first
- text: We never open more roof than can genuinely be made watertight the same day, regardless of how the schedule
    happens to be running that particular week. The property is never left exposed overnight simply for the sake
    of finishing faster. This holds regardless of how the schedule is running or how close the job is to finishing.
  title: The roof is closed every evening
- text: The manufacturer and product line used throughout the job go in writing with the final record you receive,
    so you can look them up yourself later and confirm exactly what was actually installed rather than simply trusting
    a description. This lets you confirm exactly what was installed rather than simply trusting a general description
    on an invoice.
  title: Materials get recorded by name
- text: Where it genuinely matters — for an insurer, a future buyer, or simply your own reference down the line
    — the batch and installation date of the materials used gets recorded properly and kept safely on file for whenever
    it is needed. This is genuinely useful for you, for any future buyer, and for whoever looks at the roof next.
  title: A dated record is kept
- text: If something unrelated to the agreed scope catches attention during the actual work — a soft board, a cracked
    tile elsewhere — it gets photographed and mentioned to you clearly, with no quote attached unless you specifically
    ask for one. You decide when, or whether, that becomes a job of its own at some later point.
  title: Any adjacent issue gets flagged
- text: For storm-related jobs specifically, the findings are written up the way an adjuster actually needs to read
    them — dated, photographed and specific about cause — leaving the claim itself entirely between you and your
    own insurer throughout. What we can do is make sure the paperwork on our side holds up properly to scrutiny.
  title: Documentation built for insurers
- text: On anything running more than one day, someone walks the site specifically looking for an overnight hazard
    — an open edge, loose material, anything genuinely exposed — and deals with it properly before simply assuming
    it will still be fine by morning. This happens on every day the job runs, not only on the final day before it
    finishes.
  title: The site checked before crew leaves
- text: Somebody other than the person who actually did the flashing looks it over properly before the job is called
    finished, because the person closest to a detail is usually the last one to spot what they genuinely missed
    while doing it. This is a small extra step, and it exists because the person closest to a job is usually last
    to spot what they missed.
  title: A second check on flashing work
- text: If conditions or an unexpected finding mean the job genuinely needs longer than originally planned, you
    hear that as soon as it is known to us, with a real reason attached, rather than discovering a delay only once
    it has already happened. A date pushed for a genuine reason causes far less frustration than one kept out of
    stubbornness and regretted later.
  title: You're told honestly about delays
- text: What you are billed corresponds directly to what was written in the scope you already agreed to earlier,
    with nothing appearing on it that had not already been discussed and priced at some earlier point in the job.
    If a number looks unfamiliar, you can trace it straight back to the document you already agreed to earlier.
  title: The invoice matches the scope
- text: If the findings are relevant to an insurer, a landlord or a future buyer, a copy can be sent directly to
    them with your say-so, rather than leaving you to track down and forward the paperwork yourself later. This
    saves you tracking down and forwarding paperwork you might not have kept in the right format.
  title: A copy goes to whoever needs it
- text: Before the paperwork is finally signed off, you are asked directly whether anything is unclear or unaddressed,
    rather than assumed to be satisfied simply because nobody happened to raise an objection during the working
    day itself. Most people have one small thing left unanswered, and this is where it gets a proper response at
    last.
  title: A plain question before sign-off
- text: Whoever answers the phone writes down what you describe rather than trusting memory to carry it through
    to the actual visit days later. Where the problem is, when it started, and what has changed all go on the job
    sheet before you hang up. This means the person who eventually turns up already knows what you told the first
    person on the phone.
  title: The first call gets written down properly
- text: The first question is rarely about the roof itself directly. It is about what was different just before
    you noticed the problem — new weather, work done nearby, something moved. Timing narrows causes faster than
    description alone does, and most people already have the answer without quite realising it matters.
  title: You're asked what changed recently
- text: Before anyone is booked in, the call establishes whether anything is actively getting worse right now or
    has simply been noticed recently. You are told plainly which situation you are actually in, rather than being
    told everything is urgent because urgency is simply easier to sell than patience.
  title: Urgency gets assessed honestly on the call
- text: Sometimes what you describe on the phone is genuinely enough to rule out the worrying explanation, or points
    somewhere entirely outside roofing altogether. When that happens you are told so directly, even though it costs
    us a visit. A wasted morning helps nobody, least of all the person actually paying for it.
  title: You're told if a visit is needed
- text: The day before the scheduled visit, somebody confirms the appointment still stands and checks that nothing
    has changed at your end since the original call. It is a small thing, but it is also the point where a lot of
    scheduling actually breaks down if skipped.
  title: A reminder before the visit
- text: On the morning itself, a quick message or call confirms the crew is still on track and checks there is nothing
    blocking access — a locked gate, a parked car, a dog that needs shutting away safely first before anyone arrives.
    Sorting this before arrival saves everyone standing around on your driveway waiting for something to move.
  title: Access confirmed the morning of
- text: Before anything is touched on the roof, the person on site asks you to walk through it again in your own
    words, in person this time rather than over the phone. A detail left out earlier often turns out to genuinely
    matter here. What sounds trivial on the phone sometimes reads quite differently face to face, once someone is
    actually standing there.
  title: The visit starts with questions
- text: Where something is visibly wrong is rarely where it actually started going wrong in the first place. Time
    is spent tracing the problem back properly rather than simply treating the first thing you noticed, because
    fixing the visible end without finding the source wastes real money.
  title: The cause gets traced, not guessed
- text: Once the inspection is done, you get a plain-language summary on the spot, before it is written up formally
    later. This is your chance to correct anything that sounds off or add a detail that got missed while the person
    is still standing there. This is your chance to correct anything that sounds off while the person who found
    it is still there.
  title: Findings read back to you on site
- text: Rather than one total figure that hides what it is actually made of, the quote breaks the job into its real
    parts — what each stage involves and what it costs individually. That makes it possible to see exactly where
    your money is genuinely going.
  title: The quote is itemised, not one number
- text: Nobody is asked to sign anything on the spot at the end of a visit. The written quote is left with you,
    and you are actively encouraged to compare it against anything else you have, or simply sit with it for a day
    or two first.
  title: You get time to decide
- text: Nothing gets bought or booked in until the quote is actually agreed properly, so there is no pressure built
    into the timing of your decision at all. Once you confirm, ordering begins immediately, and any lead time on
    materials is explained to you clearly. Any lead time on those materials is explained to you clearly rather than
    discovered later as an unexpected delay.
  title: Materials ordered once you say yes
- text: A short list goes out ahead of the visit — furniture, vehicles, anything fragile nearby the working area
    — so the morning of the work is not spent working around obstacles nobody thought to mention beforehand. Takes
    five minutes to read. It takes a few minutes to read and saves a genuinely awkward first hour on site for everyone
    involved.
  title: You're told what to move beforehand
- text: You are told who is on site, who is leading the job, and how to reach them directly while the work is actually
    happening. That matters more once the van has left and something occurs to you that a general office line cannot
    answer. A live number reaches an actual person once the van has left, unlike a general office line.
  title: The crew introduces itself on arrival
- text: The work is checked against the written scope at intervals through the working day, not left until the crew
    is already packing up to leave. Catching a mismatch at midday is a five-minute conversation. Catching it at
    five o'clock is a much harder one. Catching a mismatch early in the day is a five-minute conversation rather
    than a difficult one later.
  title: Progress checked against the plan
- text: Where it helps, you are shown what the area looked like before the work started and what it looks like now,
    side by side rather than relying on memory alone. It is a small courtesy, and also the clearest way to confirm
    the work matches what was agreed.
  title: You're shown before and after
- text: Whatever occurs to you while looking at the finished roof gets answered there and then, in plain terms,
    rather than deferred to a follow-up call you would have to remember to make yourself later. If nobody knows
    the answer immediately, you are told when you will.
  title: Questions answered on the spot
- text: Before anyone actually leaves the property, you get a plain description of what to expect over the weeks
    that follow — settling, minor variation, anything genuinely worth a call versus what is simply part of how the
    roof beds in naturally. This distinguishes between what is genuinely part of the roof settling in and what would
    actually be worth a call.
  title: You're shown what to watch for
- text: Rather than a vague promise to check in sometime later, an actual rough date gets set before the crew leaves
    the property. The check-in becomes a plan already on the calendar rather than a hope that somebody remembers
    to make the call weeks afterward. This becomes a plan already on the calendar rather than a hope that somebody
    remembers weeks later.
  title: A follow-up date agreed on the spot
- text: When a check-in date was agreed at the end of the job, it happens on or near that date without you having
    to chase it yourself. It is a small thing to get right, and, going by what people tell us about other contractors,
    an oddly rare one.
  title: The follow-up actually happens
- text: The follow-up call is a genuine question rather than a formality — has it stayed the way it should, has
    anything changed, is there anything you have noticed since the crew left. Your answer shapes what happens next,
    rather than the call being a box to tick.
  title: You're asked, not just told
- text: If you mention something at the follow-up, it goes into the record with the same care as the original findings,
    rather than noted informally on a scrap of paper somewhere and quietly lost the next time anybody actually looks
    at the file. This is treated with the same care as the original findings rather than noted informally and later
    lost.
  title: Anything raised gets logged properly
- text: On anything running more than a day or two, someone senior to the crew checks the job partway through against
    the written scope, independently of the people doing the physical work, so a second opinion exists before the
    very end rather than only at it.
  title: A supervisor checks in partway through
- text: If conditions are marginal on a scheduled day, there is an agreed alternative — a different day, a partial
    start, protective measures — discussed with you well in advance rather than improvised on the morning things
    start to look doubtful outside your window. You are never simply told to wait and see what happens once conditions
    start to look doubtful.
  title: A fallback plan if weather turns
- text: Occasionally what looked straightforward from the original inspection turns out to need different expertise
    once it is properly opened up on site. When that happens you are told plainly, and the referral is made directly
    rather than stretching the job to cover ground it should not.
  title: You're told if a specialist is needed
- text: Once the written scope is finalised, it is read through with you line by line rather than handed over for
    a quick signature on the doorstep. Catching a misunderstanding before work starts costs a few minutes; catching
    it afterward costs considerably more time and money.
  title: The scope gets read back before signing
reviews:
- name: Marcus D.
  text: Came out, went up, came down and told me the flashing had gone and the rest of the roof was fine. I had
    been quoted for a full replacement two days earlier. Job took an afternoon.
- name: Priya S.
  text: What I appreciated was the photographs. I have never seen my own roof and suddenly I could see exactly what
    they were talking about.
- name: Ellen R.
  text: Storm took a section off on a Sunday night. They had it covered by Monday afternoon and did the permanent
    repair the following week once the weather allowed. No drama.
- name: Tomás V.
  text: The quote said what it included and, more usefully, what it did not. Nothing turned up on the final invoice
    that we had not already talked about.
- name: Janet K.
  text: They told me my roof had about five years left and did not try to sell me anything. I called them back the
    following year for the gutters, which I suspect was the point.
- name: Derek A.
  text: Left the garden cleaner than they found it, which after the last lot of builders felt almost suspicious.
- name: Anita M.
  text: Ceiling stain in the back bedroom, nowhere near where the actual problem was. They explained why, showed
    me, fixed it. Has been dry through two winters.
- name: Chris B.
  text: Straight talking. Asked me what I actually wanted to spend and worked out from there instead of starting
    with the biggest option.
- name: Rosa L.
  text: Booked, moved once because of rain, told me about it the day before rather than on the day. That sounds
    small and it really is not.
- name: Ben H.
  text: The written report was more thorough than the survey I paid for when I bought the house.
- name: Nadia F.
  text: Small repair, fair price, no attempt to expand it into something bigger. Have already passed the number
    on twice.
- name: Gordon P.
  text: They walked me round at the end and pointed out a section that will need attention in a few years, and specifically
    did not quote for it. Refreshing.
- name: Helena W.
  text: Turned up when they said, told me the ridge needed attention and the rest did not, and did exactly that.
    No upsell, no drama.
- name: Samir P.
  text: They found the leak was coming in six feet from where the stain was. Explained why, showed me the photo,
    fixed it.
- name: Grace O.
  text: Rain moved the job twice and they told me both times the day before. Sounds trivial until you have been
    let down by a trade.
- name: Ivan T.
  text: The written report was the most useful thing — I used it when I sold the house.
- name: Bea M.
  text: Cleaned up so thoroughly I had to check they had actually been.
- name: Callum R.
  text: Asked what I could spend before quoting, and worked out from there rather than starting at the top.
- name: Dev P.
  text: Storm took a strip of ridge tiles off and I assumed the worst. They were up there within the week, showed
    me photographs of the ridge and the field around it, and told me the covering itself had years left. Rebedded
    the ridge and that was that. I had braced myself for a five-figure conversation.
- name: Angela R.
  text: The bit that won me over was being told what not to do. I wanted the whole roof done in one go because I
    was tired of thinking about it. They walked me through which slopes were actually failing and which were fine,
    and suggested doing the failing one now and the rest when it needed it.
- name: Tomas B.
  text: Water was coming in above the kitchen and two people had already looked at it. {company} traced it to the
    chimney flashing, which is nowhere near where the stain was. Apparently that is normal and water travels along
    the timbers. Fixed in an afternoon after a month of guessing.
- name: Hannah K.
  text: They put a tarpaulin on the same evening I called because rain was forecast, then came back properly when
    the weather cleared. Nobody tried to sell me anything while the ceiling was still wet, which I noticed at the
    time and appreciated more later.
- name: Raj M.
  text: Quoted, and the quote held. The written version listed what would happen if the deck underneath turned out
    to be soft, with the price for that named up front, so when a section did need boarding there was no argument
    about it. That is the whole thing, really.
- name: Louise F.
  text: I have lived here eleven years and never seen my own roof. Now I have a folder of photographs of it. Whether
    or not you need work doing, being shown the actual condition of the thing over your head is worth the visit.
- name: Michael O.
  text: Sceptical going in, because the previous firm had left nails all over the drive and I have a dog. These
    lot swept the whole perimeter twice with a magnet and walked it with me before they left. Small thing. It was
    the reason I called them back for the garage.
- name: Sunita A.
  text: Told me I had three or four winters left and that patching it now would be money I would spend again. No
    pressure to book anything. I called them back the following autumn and they remembered the property.
- name: Gareth W.
  text: Valley between the two roof sections had been leaking for years and every previous fix was a bucket of sealant.
    They stripped it back, showed me the rotten timber underneath, and rebuilt the valley properly. First winter
    in a long time without a drip.
- name: Fatima H.
  text: Communication was the difference. I knew which day, roughly what time, what the noise would be like and
    when the skip was arriving. I work from home and that mattered a great deal more than I expected it to.
- name: Peter L.
  text: Insurance wanted photographs and a written description of the damage in a particular format. They produced
    it without me having to explain twice, and the claim went through without the back and forth I had been dreading.
- name: Chloe N.
  text: Two quotes came in wildly apart and I could not work out why. {company} sat down and explained what the
    other one had priced for and what it had left out. They were not the cheapest and I went with them anyway, because
    it was the only quote I actually understood.
- name: Ade S.
  text: Flat roof over the extension had been patched by three different people. Rather than adding a fourth patch
    they explained why it kept failing at the upstand, and did that detail properly. Two winters on and it is still
    dry.
- name: Marianne T.
  text: They turned up when they said, which sounds like a low bar until you have waited in twice for someone who
    never came. The work was neat and they took the old material away rather than leaving it beside the bins.
- name: Owen D.
  text: I asked a lot of questions because I like knowing how things work. Nobody got impatient. I now understand
    more about how a roof sheds water than I strictly need to, and I trusted the invoice because of it.
- name: Bea C.
  text: The loft inspection was the useful part. They went up inside as well as outside and found daylight through
    a spot I would never have looked at. Cheap to fix now, apparently expensive to fix in three years.
- name: Nathan G.
  text: Called about a slipped slate and half expected to be told I needed the lot replaced. Two slates went back,
    they checked the surrounding fixings while they were up there, and the bill was about what I would spend on
    a weekly shop.
- name: Priyanka V.
  text: Scaffolding went up on a Monday and came down on the Thursday, exactly as described. The neighbours were
    told beforehand because the scaffold needed a foot on their side, and that was handled before I had to think
    about it.
- name: Callum E.
  text: They found that a previous repair had been done straight over the failing material rather than removing
    it, which is why it had failed again. Seeing that explained ten years of intermittent damp in one visit.
- name: Rosa I.
  text: Older property, awkward pitch, and two firms had simply not called me back. {company} came, looked, and
    gave me a price for the access as a separate line so I could see what the difficulty was actually costing.
- name: Duncan Y.
  text: Gutters were the real problem, not the roof. They said so, cleared and refitted a section that had dropped,
    and declined to quote for the roof work I had asked about. I have sent them three neighbours since.
- name: Ines M.
  text: Rain came in during the job, as it does. They had the area covered before it started and nothing got wet
    inside. That is planning rather than luck and I could tell the difference.
- name: Solomon B.
  text: Everything was written down. What was included, what was not, and what would trigger a change in price.
    When something did come up, we looked at the sheet together and it was already on it.
- name: Verity J.
  text: They photographed each stage, so when I asked what had actually been done under the tiles I could see it
    rather than take it on faith. For work you cannot inspect yourself, that changes the whole transaction.
- name: Femi A.
  text: Moss had built up badly and I had been told by a doorstep caller that the roof was dangerous. {company}
    looked and said the moss was cosmetic on this covering, cleared what mattered around the valleys, and charged
    for an hour.
- name: Karen S.
  text: Elderly mother's property and I was managing it from two hundred miles away. They sent photographs and rang
    me rather than her, exactly as agreed, and were patient with a lot of questions from a daughter who knows nothing
    about roofs.
- name: Jamal R.
  text: The leak was intermittent, which apparently is the hard kind. They came back a second time at no charge
    when it reappeared, found the wind-driven path they had missed first time round, and sorted it. Owning the miss
    mattered.
- name: Elspeth W.
  text: Neat, quiet, and gone by the time I got home. The only evidence of a two-day job was a roof that had stopped
    leaking and an invoice that matched the quote to the penny.
- name: Kwame O.
  text: I wanted to understand the difference between the two materials they offered rather than just being told
    which was better. They gave me the honest trade-off, including where the cheaper one is genuinely fine, and
    let me choose.
- name: Lydia F.
  text: Reported a stain that had been there since we moved in. They checked, said it was historic and not active,
    and told me to photograph it and watch it rather than pay anyone to open the ceiling. No charge for the visit.
- name: Bruno C.
  text: Chimney needed repointing and the flashing renewing at the same time, which they explained was cheaper together
    than separately because of the access. Made obvious sense once said out loud, and nobody had said it before.
- name: Aisha N.
  text: The crew were polite to my kids, who wanted to watch everything, and firm about where they were not allowed
    to stand. Handled far better than I would have handled it.
- name: Terence H.
  text: Two seasons of a bedroom smelling damp and nobody connecting it to the roof. Turned out to be a blocked
    outlet backing water up under the covering. Diagnosis took twenty minutes and the fix took an hour.
- name: Yuki T.
  text: Detailed quote, no pressure to sign, and a straight answer when I asked if it could wait until spring. It
    could, they said, and it did. They rang in March rather than making me chase.
- name: Emeka D.
  text: Full replacement on a bungalow and the thing I remember is the site being tidy every single evening. Materials
    stacked, offcuts bagged, drive swept. My neighbour asked for their number on day two.
- name: Freya B.
  text: I got three quotes and theirs was in the middle. It was also the only one that had been on the roof rather
    than looked at it from the pavement, which I only realised when I compared what each had noticed.
- name: Idris K.
  text: The dormer had been leaking where it met the main roof. They explained why that junction is the usual suspect
    on this kind of build and showed me the failed detail. Fixed properly rather than sealed over.
- name: Noor J.
  text: Straightforward from the first call. Someone answered, someone came, someone did the work, and the same
    person rang afterwards to check. It should not feel remarkable and yet here I am writing about it.
- name: Gordon M.
  text: They talked me out of a full strip and re-cover, which I had already half decided on. Did the repairs that
    were needed and told me what to look for that would mean the bigger job was due.
- name: Camille P.
  text: Emergency on a Sunday after a branch came through. They made it safe and dry the same day, then came back
    on the Tuesday to do it properly. Nobody tried to price the full job while I was panicking.
service_bullets:
- A full inspection of the affected area and the details around it, not just the reported spot
- Photographs from the roof, before and after, supplied with the written report
- A written scope stating what is included and what is specifically excluded
- Removal and disposal of everything taken off the roof
- Replacement of fixings and fasteners in the working area as standard
- Checks on flashings, valleys and penetrations adjoining the work
- Loft or ceiling-void inspection where it is safely accessible
- Temporary weatherproofing if the permanent fix has to wait
- Nail sweep and site clearance before the crew leaves
- A walk-round with you, on the ground, showing what changed
- Manufacturer and product line recorded in writing
- Notes on any adjacent issue we found but did not price
- Protection for planting, paths and vehicles under the working area
- A follow-up check after the first significant rainfall
- Inspection of the loft insulation where the work exposes it
- Replacement of any battens found soft in the working area
- Sealing and dressing of every flashing disturbed by the work
- Debris cleared from the gutters below the working area
- Photographs of any adjacent defect we found but did not price
- Skip or waste removal included, not billed separately
- Written note of what was replaced and what was reused
- Confirmation that the roof was closed and watertight each evening
- Ridge and hip bedding checked and re-pointed where disturbed
- Access equipment erected, inspected and removed by us
- Any exposed timber treated before it is covered again
- A dated record of the materials batch used
- Overhanging vegetation flagged if it will shorten the repair's life
- A written note of anything we recommend leaving alone for now
- Loft-hatch access left as we found it
- Contact details for the crew lead while the job is running
- A full inspection of the affected area and the details immediately around it, not just the spot you reported
- Photographs taken from the roof, before and after, supplied with the written report rather than on request
- A check of the loft or ceiling void wherever one is accessible, because condensation and leaks look identical
  from inside
- The suspected entry point identified and shown to you before any price is discussed
- A written quote that states what is included and, separately, what is excluded
- The cost of the likely surprises named in advance, so a variation is not an argument
- Access priced as its own line, so you can compare quotes that assume different access honestly
- All stripped and failed material removed from site rather than left beside the bins
- A magnet run over the ground and drive at the end, so no fixings are left where tyres or feet go
- Neighbours notified in advance where scaffold needs a foot on their side
- Dated photographs and a written damage description in the format insurers ask for
- Temporary covering fitted the same day where rain is forecast and the roof is open
- 'A clear statement of urgency: needed now, needed eventually, or not needed yet'
- Adjacent details checked while access is in place, at no extra visit cost
- Fixings and material matched to what is already on the roof wherever a like-for-like repair is possible
- The site left tidy at the end of each working day, not only at the end of the job
- One point of contact who has seen the roof, rather than a call centre reading from a record
- A plain explanation of what was found, including the parts that are sound and need nothing
- Confirmation of which day and roughly what time, given before the work rather than on the morning
- Gutters and outlets checked as part of the inspection, since drainage causes a surprising share of roof complaints
- Ventilation paths at the eaves checked where the loft is accessible
- Any previous repair identified and assessed, since a fix applied over failing material is a common cause of recurrence
- A second visit at no charge if the fault reappears and the original diagnosis was wrong
- Written confirmation of what was actually done, not only what was quoted
- Scaffold erection and removal dates agreed in advance and kept to
- Debris cleared from valleys and around penetrations while access is in place
- An honest view on whether the work can safely wait for settled weather
- Timber condition reported where it is exposed during the work, with photographs
- Materials stacked and covered on site rather than spread across the drive
- The old covering taken away the same week rather than left in a skip indefinitely
- Any part of the quote you do not understand explained again, in different words, without impatience
- A note of what to watch for that would mean further work is becoming due
- Work sequenced so the roof is never left open overnight without cover
- Findings shared with a family member or agent instead, where that is who is managing the property
- Chimney and flashing assessed together where both are within the same access
- Confirmation of whether the fault is storm damage or wear, since insurers treat them differently
- The invoice matched to the quote, with any variation itemised and previously agreed
- A recommendation to do nothing, where doing nothing is the correct advice
- Access equipment removed promptly once the work is signed off
- Photographs kept on file, so a later question about the same roof can be answered without another visit
- Existing guarantees or handover paperwork reviewed where you still have them
- The reason for the failure explained, not only the fact of it
- Realistic timescales given at the point of quoting rather than optimistic ones
- Awkward pitches and difficult elevations priced honestly rather than declined without explanation
- A straight answer about whether another quote you have received is reasonable
service_intros:
- paras:
  - '{service} is one of the jobs {company} does most[[ around {city}]], and it is usually more contained than people
    fear.'
  - The work starts with finding out exactly what has failed and why. Roofs leak at their joints far more often
    than across their surfaces, so the fix is frequently local even when the symptom is not.
  - Once that is established you get a written scope with a price against it, and nothing outside that scope happens
    without a conversation.
- paras:
  - 'When people call about {service_lower}, the underlying question is nearly always the same: is this a small
    problem or a large one?'
  - That is answerable, but only from the roof. {company} inspects first, reports in writing with photographs, and
    prices the work that the inspection actually supports.
  - Sometimes the honest answer is that it can wait a season. We would rather say that and be called again in a
    year.
- paras:
  - '{company} approaches {service_lower} the same way every time: understand the failure, size the response to
    it, document both.'
  - That sounds obvious. It is not what usually happens, which is why so many roofs get replaced when a section
    needed attention, and so many get patched when the deck was already gone.
  - You will see the evidence either way before you are asked to decide anything.
- paras:
  - '{service} sits at the point where a small maintenance job and a large capital one meet, and which side you
    are on depends on details you cannot see from the ground.'
  - So {company} looks properly first[[ at your {city} property]]. The inspection is written up whether or not the
    work goes ahead.
  - If the roof is sound, we will tell you and you will have a record saying so.
- paras:
  - There is no clever version of {service_lower}. It is careful diagnosis, correct materials and unhurried workmanship,
    in that order.
  - '{company} works to that sequence and writes down each stage of it, which is the only reliable way to tell afterwards
    whether a job was done properly.'
  - Call {phone} and describe what you are seeing, and we will tell you what the likely causes are before committing
    you to anything.
- paras:
  - Most {service_lower} jobs are decided in the first twenty minutes on the roof.
  - That is where you find out whether the problem is a run of fixings, a single failed detail, or a deck that has
    been wet long enough to soften. Each of those is a different job with a different number attached.
  - '{company} does not quote until that is settled, which is why our first visit is an inspection rather than a
    sales call.'
- paras:
  - Weather does most of the damage roofers get called about, and it rarely does it evenly.
  - For {service_lower}, {company} works the whole roof rather than the visible corner, because the section that
    looks worst is often not the section letting water in[[ on {city} properties]].
  - You get the full findings, including the parts that are fine.
- paras:
  - '{company} treats {service_lower} as a documentation job as much as a physical one.'
  - Photographs before, a written scope, photographs after, and a note of materials. That record is what lets you
    challenge us, insure the property properly, and inform whoever looks at the roof next.
  - The physical work is the easy half.
- paras:
  - 'Most people calling about {service_lower} want one question answered first: is this contained, or is this the
    start of something bigger?'
  - '{company} answers that from the roof, in writing, before any number is discussed. The inspection stands whether
    or not you use us for the work.'
  - Call {phone} and describe what changed and when — that alone often narrows the likely cause.
- paras:
  - '{service} goes wrong in a predictable way: someone fixes the visible damage rather than the point where water
    actually enters.'
  - '{company} works the whole covering and every detail on it, then prices only what the findings support[[ on
    your {city} property]].'
  - The parts that are sound are reported as sound, which is the half of the report most people never get.
- paras:
  - The honest range on {service_lower} is wide, because it depends on what is under the covering.
  - So {company} looks first. You get photographs, a written scope, and a price that matches the scope rather than
    the worst case.
  - If it can safely wait a season, that is what you will hear.
- paras:
  - '{company} treats {service_lower} as a documentation job as much as a physical one — before, during and after.'
  - That record is what lets you hold anyone to the work, insure the property properly, and inform whoever looks
    at this roof next.
  - Call {phone} to start with a look rather than a quote.
- paras:
  - 'There is no clever shortcut in {service_lower}: careful diagnosis, correct materials, unhurried workmanship.'
  - '{company} works to that order and writes down each stage, which is the only reliable way to judge afterwards
    whether it was done properly.'
  - Nothing outside the agreed scope happens without a conversation first.
- paras:
  - '{service} is decided in the first twenty minutes on the roof — whether the problem is a run of fixings, one
    failed detail, or a deck that has been wet too long.'
  - Each of those is a different job with a different number attached, which is why {company} inspects before quoting.
  - The first visit is an inspection, not a sales call.
- paras:
  - '{service} is one of those jobs where the diagnosis matters more than the technique. Getting the work right
    is a question of doing the detail properly; getting the job right is a question of establishing that this detail
    is the one causing the problem.'
  - '{company} inspects the reported area and everything around it before quoting, because water tracks along timbers
    and under coverings and shows itself some distance from where it got in. You get photographs from the roof,
    a plain description of what was found, and a price that names what it does and does not include.'
- paras:
  - 'The useful version of {service_lower} starts with what you will actually receive: an inspection of the affected
    area and its surrounding details, photographs before and after, the work itself, and a site left clean with
    a magnet run over the ground where fixings could have fallen. {company} treats those as the job rather than
    as chargeable extras.'
  - The written quote sets out the exclusions, so if something is found once the covering is opened, the number
    for it was already on the sheet rather than arriving as a surprise on the day.
- paras:
  - Most enquiries about {service_lower} describe a symptom — a stain, a drip, something that has moved — rather
    than a fault, and that is exactly as it should be. Working out which fault produced the symptom is the job.
  - '{company} does that first and quotes second. A fair proportion of visits end with a smaller and cheaper explanation
    than the one the customer expected, and occasionally with a recommendation to do nothing for now and watch a
    specific thing instead.'
- paras:
  - '{service} sits in a trade where urgency sells well and diagnosis sells badly, which is why so much of it gets
    quoted from the pavement. {company} works the other way round: onto the roof, into the loft where there is one,
    photographs of what is actually there, and then a conversation about whether the work is needed now, needed
    eventually, or not needed.'
  - A covering with several winters left in it does not need attention this year, and being told so is the part
    of this service that is hard to fake.
- paras:
  - Access is the part of {service_lower} that surprises people, and it is worth understanding before comparing
    prices. Reaching a single-storey rear slope off a ladder is a different job from a three-storey elevation needing
    a scaffold, even where the work itself is identical.
  - '{company} prices access as its own line so the difference is visible. It also means that where two pieces of
    work share the same access — a chimney and the flashing around it, for instance — doing them together genuinely
    costs less than doing them a year apart.'
- paras:
  - The commonest reason {service_lower} has to be done a second time is that the first attempt fixed the place
    where the water appeared rather than the place where it entered. Those are frequently at opposite ends of a
    room.
  - '{company} traces the path before pricing anything, which takes longer on the day of the inspection and is the
    reason the repair holds. Photographs of the actual entry point come with the quote, so you can see what the
    price is based on.'
- paras:
  - Written quotes for {service_lower} are only comparable when they describe the same job, and often they do not.
    One may include scaffold where another assumes ladder access. One may allow for replacing failed decking where
    another prices the covering alone.
  - The headline figures then differ substantially for reasons that have nothing to do with quality. {company} writes
    its assumptions down explicitly. Asking the other quotes for the same usually clarifies the picture within a
    day.
- paras:
  - On older properties {service_lower} is largely an exercise in restraint. Traditional materials and original
    detailing generally want a like-for-like repair rather than a modern substitute, and a roof that has stood for
    a century usually needs its failed detail addressed rather than the whole assembly updated.
  - 'Sealant spread over a failing valley is the standard shortcut: it buys a season and conceals what is happening
    underneath. {company} assesses from what the roof was built to do, and a traditional repair is usually both
    correct and cheaper.'
- paras:
  - '{service} on a recently built property is rarely about the covering. The material is young and the field is
    usually sound; what fails is the detailing that was rushed at handover — a flashing dressed badly, a junction
    where an extension meets the main roof, an outlet set slightly proud so it never quite drains.'
  - These are repairs rather than replacements, which is worth knowing before accepting a quote that starts from
    the whole roof. {company} sees this pattern regularly and prices accordingly.
- paras:
  - If an insurer is involved in your {service_lower}, the documentation is part of the visit rather than an add-on.
    Dated photographs, a written description of the damage in the form insurers expect, and a breakdown that separates
    making safe from permanent repair.
  - '{company} produces all of it as standard, because a claim that stalls on paperwork costs everyone time and
    helps nobody. Mention the claim on the first call and the visit is set up for it.'
- paras:
  - Timing is a fair question about {service_lower} and it usually has an honest answer. Some work genuinely cannot
    wait, because each wet week makes it worse and more expensive to put right.
  - A good deal of it can wait until settled weather without any real risk. Being told which of the two you are
    looking at is more useful than being booked in immediately, and {company} would rather have that conversation
    than fill a diary.
- paras:
  - The written quote for {service_lower} exists to prevent the argument that most roofing complaints are actually
    about. Not workmanship — a price that moved partway through because something was found that nobody had said
    might be there.
  - Soft decking beneath an old covering is the classic example, and while nobody can see through a roof, everybody
    knows it is a possibility. {company} names that number in advance.
  - If the boards are sound the quote is the price; if they are not, you already knew the figure.
- paras:
  - '{service} is priced on what is wrong rather than on what would be most profitable, which sounds like a slogan
    until you have had the alternative. The inspection produces a finding, the finding produces a scope, and the
    scope produces a number.'
  - Where the honest scope is smaller than the enquiry suggested, that is what gets quoted. {company} would rather
    do the two-hour job well and be called again than sell the large one once.
- paras:
  - 'What makes {service_lower} hold is the detail nobody sees afterwards: the laps, the upstands, the fixings pattern,
    the way the covering is dressed into the adjacent material. {company} photographs those stages precisely because
    you cannot inspect them once the job is finished.'
  - For work carried out above head height and then covered over, being able to see what was done underneath changes
    the whole transaction.
- paras:
  - Roofs fail at their junctions far more often than across their fields, and {service_lower} is usually a junction
    problem in disguise. Flashings, valleys, ridge, penetrations, abutments where a lower roof meets a wall — these
    are where the water gets in, and where an inspection should spend its time.
  - '{company} checks those first. It shortens the visit, and it is the reason a fault that has defeated two previous
    attempts is often found in twenty minutes.'
- paras:
  - The service is deliberately plain. Somebody comes out, gets onto the roof rather than looking at it from the
    ground, checks where roofs actually fail, and looks in the loft where there is one.
  - You then get photographs and an explanation in language that does not require a trade background — including
    the parts that are fine, because knowing what is sound is as useful as knowing what is not. {company} quotes
    only after that, and only for what the inspection found.
- paras:
  - There is no price list for {service_lower}, and any that exists is marketing. What the work costs depends on
    the area involved, the pitch, how the crew reaches it safely, the material, and what is found beneath the covering
    once it is opened.
  - '{company} explains which of those apply to your roof, gives a written figure, and names the conditions that
    would move it. A number without a roof attached to it tells you nothing you can use.'
- paras:
  - Doorstep callers price {service_lower} from the ground, and after bad weather there are a lot of them. Some
    are entirely competent.
  - Others quote a full replacement for something that needs two hours and a bag of fixings, and the customer has
    no way to tell the difference because nobody has been up there. A second opinion from the roof itself costs
    very little and {company} is happy to give one, including when the answer is that the first quote was fair.
signs:
- text: A mark that darkens or spreads with each downpour is active. One that stays exactly the same size is usually
    historic and worth watching rather than panicking about.
  title: A stain that grows after rain
- text: Granules washing off the covering mean the surface is wearing. On its own it is not urgent; combined with
    age it tells you roughly where you are in the roof's life.
  title: Grit in the gutters
- text: If you can see light through the boards from inside, water is getting the same route. This one does not
    wait.
  title: Daylight through the roof space
- text: One after a storm is normal. Two or three, or the same spot twice, means the fixings in that area have had
    enough.
  title: A tile or slate on the lawn
- text: A dip that follows a rafter or a valley suggests something structural underneath rather than a covering
    problem, and needs looking at before it is covered up.
  title: Sagging along a line
- text: The commonest single cause of leaks. If the metal has pulled away or the mortar behind it is crumbling,
    water has a direct route in.
  title: Flashing lifting at a chimney or wall
- text: Often an abutment or a gutter overflowing behind a fascia rather than the roof covering itself. Worth diagnosing
    before anyone climbs on the tiles.
  title: Damp on an upstairs wall, not the ceiling
- text: Cosmetic on a young roof, less so on an old one — it keeps the covering damp and can lift edges over a few
    winters.
  title: Moss holding water on the surface
- text: If the same spot has been patched twice, the patch is not the problem. The diagnosis was.
  title: A repair that did not hold
- text: Snow or frost melting in patches usually means heat escaping, which is insulation rather than roofing —
    but it is worth knowing before you spend on the wrong thing.
  title: Cold rooms and a warm roof in frost
- text: Fixings that lift as timber moves are why a roof can start shedding tiles all at once after years of behaving.
  title: Nails backing out
- text: Water is going somewhere other than down the pipe, and the fascia behind it is usually already soft.
  title: Gutters pulling away from the fascia
- text: Granules washing off the shingles mean the surface is wearing. On its own that is not urgent — every roof
    sheds some, especially a new one. Combined with age and with bald patches visible from the ground, it tells
    you roughly where you are in the roof's life, which is useful for planning rather than panicking. Worth mentioning
    on the phone along with roughly how much has collected.
  title: Grit in the gutters
- text: A ceiling mark that grows or deepens after every heavy spell is genuinely active and worth a call fairly
    soon. One that has stayed exactly the same size for a year or more is usually historic, and treating it as urgent
    regardless mostly means paying for a visit that could reasonably have waited a while longer. The difference
    between the two matters more than the stain itself does.
  title: A stain that darkens after rain
- text: If you can see light coming through the underside of the deck from inside the loft, water can find precisely
    the same route in whenever it actually rains outside. This is one of the few signs on this list that genuinely
    does not wait for a convenient afternoon to be dealt with properly. It is worth a call the same day you notice
    it.
  title: Daylight through the roof boards
- text: One piece down after a windy night is fairly ordinary and rarely means much on its own. Several pieces,
    or the same corner losing material twice within a season, points to fixings in that area that have genuinely
    had enough and need looking at properly before the next storm. Worth a photograph and a call rather than simply
    sweeping it up.
  title: A tile lost after a storm
- text: A dip in the roofline that traces a specific structural line, rather than sitting in one random spot, usually
    means something is happening underneath the covering rather than a surface problem alone. It is worth having
    looked at properly before it gets quietly covered by a repair that only addresses what actually shows on top
    of it.
  title: A sag along a rafter line
- text: This is the single most common cause of a genuine roof leak by a wide margin. If the metal has visibly pulled
    away from the brick or the sealant behind it has cracked and crumbled away, water has a fairly direct path straight
    into the structure, and it is worth acting on properly rather than simply watching it worsen.
  title: Flashing lifting at a chimney
- text: Damp appearing on a wall rather than a ceiling more often points to a wall abutment or an overflowing gutter
    behind the fascia than to the roof covering itself directly. It is worth having someone diagnose it properly
    before assuming the roof needs work, because the actual cause here is frequently somewhere else entirely on
    the property.
  title: Damp on an upstairs wall
- text: On a young roof this is largely cosmetic and rarely worth acting on immediately at all. On an older one
    it keeps the covering damp for longer after every rainfall and can gradually lift edges over successive winters,
    which is the point at which it genuinely stops being purely cosmetic and starts becoming worth addressing properly.
  title: Moss holding water on the roof
- text: If the same area has been patched more than once and the leak keeps quietly coming back, the patch was never
    really the actual problem in the first place. Something upstream of that visible spot is still causing it, and
    until that gets properly found, each new patch is simply buying a little more time on the same underlying fault.
  title: A repair returning to the same spot
- text: Uneven melting on an otherwise frosty or snow-covered roof usually means heat is escaping from below in
    that particular patch, which points toward insulation and ventilation rather than the roof covering itself directly.
    Worth mentioning to whoever inspects it, because the actual fix here is sometimes not a roofing fix at all.
    Worth pointing out on the call, since it changes where the assessment should actually start looking.
  title: Frost melting unevenly on the roof
- text: Fixings that have started working loose as timber moves through repeated seasons of expansion and contraction
    are why a roof that has behaved for years can suddenly begin shedding tiles or shingles after one bad storm
    arrives. It is worth catching this before that storm comes rather than dealing with the aftermath once it already
    has.
  title: Nails visibly backing out
- text: If a gutter has visibly separated from the board sitting behind it, water is going somewhere other than
    down the downpipe as intended, and that board is very often already softening underneath from the exposure.
    This is worth acting on before the fascia itself needs replacing entirely along with the gutter. It is worth
    a call sooner rather than later once you notice this happening.
  title: Gutters pulling from the fascia
- text: A covering that used to sound solid and now gives a hollow note where you tap or press it gently is a fairly
    reliable sign that something underneath has begun separating from its base. This often happens well before any
    visible damage actually shows itself on the surface for anyone to notice from a normal distance.
  title: A hollow sound when tiles are tapped
- text: Small, soft dimples on the shingle surface, distinct from ordinary wear, can indicate hail has genuinely
    damaged the mat beneath the granules even where the covering still looks intact from a distance away. Worth
    having assessed properly rather than assumed either way, particularly after a significant hailstorm has passed
    through the area. Mentioning roughly when the storm happened helps narrow down what to check first.
  title: Bruising visible after hail
- text: Edges lifting or curling visibly upward is a fairly common sign of a shingle nearing the end of its natural
    service life, particularly on a roof that has had years of direct, unshaded sun exposure. It is not usually
    urgent on its own, but it is worth factoring properly into planning for the roof's remaining years.
  title: Curling at shingle edges
- text: Leaves, moss and grit collecting in a valley concentrate water and slow drainage exactly where the roof
    already works hardest of anywhere on the whole covering. Left alone this tends to accelerate wear at the valley
    lining specifically, well before the rest of the covering shows any comparable sign of ageing at all. Clearing
    it yourself where you safely can is sensible, but the underlying cause still needs a proper look.
  title: Debris packed into a valley
- text: Condensation on the inside of a skylight is often simply a ventilation issue inside the room itself rather
    than a sign the unit is genuinely failing outright. A leak, by contrast, tends to show as a stain or drip near
    the frame rather than a general fog spread across the glass, and the difference is worth noting properly before
    calling anyone out.
  title: A skylight fogging on the inside
- text: Contact from overhanging limbs keeps a section of roof damp for longer after every rainfall, drops debris
    directly into valleys and gutters, and can physically abrade the surface with every gust of wind that passes
    through. It shortens the life of everything underneath it, even when nothing looks visibly wrong up there just
    yet. Worth mentioning even if the tree work itself is somebody else's job entirely.
  title: Branches touching the covering
- text: A ridge that has developed a visible wave or dip along its length, rather than running properly straight,
    can point to movement in the structure below it or simply ageing bedding at the ridge tiles themselves. Either
    way it is worth a proper look rather than a rough guess made from the pavement below. Worth photographing from
    the same spot every few months to track whether it is actually changing.
  title: A wavy ridge line
- text: A membrane that gives noticeably underfoot in one specific area, rather than feeling consistent across the
    whole surface, usually means moisture has already gotten into the insulation layer sitting below it. It is one
    of the more reliable early signs on a flat or low-slope roof, well before anything shows as an actual visible
    leak indoors.
  title: Soft spots on a flat roof
- text: Orange or brown staining running down a covering below a metal detail usually means that particular fixing
    or flashing has started corroding, which is often the first genuinely visible sign that it needs attention before
    it eventually fails outright and lets water through at that exact point. Worth flagging early, since the fixing
    itself is usually cheaper to replace than what it is holding.
  title: Rust streaks under metal fixings
- text: A room that has become noticeably colder or draughtier than the rest of the house, with nothing else obviously
    different about it, sometimes points to a ventilation or insulation gap at the roof rather than anything wrong
    with the heating itself. Worth mentioning specifically when you call, since it genuinely narrows down where
    to look first.
  title: A new cold spot indoors
- text: Dark streaking is very often algae rather than actual damage, and largely cosmetic on most coverings, though
    it is worth confirming rather than simply assuming, particularly where it appears alongside other genuine symptoms.
    Algae alone is rarely a reason to act quickly, but it is worth properly knowing which one you are actually looking
    at.
  title: Dark streaking on the covering
- text: A visibly mismatched patch is not automatically a sign of poor workmanship on its own, but it is worth asking
    why the match was not closer and what was actually done underneath it at the time. Sometimes the answer is a
    sound repair with materials that simply were not cosmetically available. Sometimes it is a genuine corner that
    was cut.
  title: A patch that doesn't blend in
- text: Reaching the age where a covering typically starts to need attention, without yet showing an obvious symptom
    of its own, is a reasonable trigger to have it checked rather than waiting patiently for the first visible sign.
    Catching wear before it becomes a leak is nearly always cheaper than reacting once it genuinely already has.
  title: Reaching the roof's typical age
- text: An odour that appears only after wet weather, rather than being constantly present all the time, is a genuinely
    useful clue about where to look, because it suggests something conditions-driven rather than a constant, unrelated
    source somewhere else. Mention exactly when it appears on the call, since that timing narrows the likely cause
    considerably beforehand.
  title: A smell only after rain
- text: A section that visibly deflects or ponds water under your own weight, rather than shedding it cleanly away,
    suggests either a drainage fall problem or genuine deterioration in the deck underneath the membrane itself.
    Standing water on a flat roof is common right after rain; water that never actually clears afterward is the
    part genuinely worth reporting.
  title: Water pooling on a flat roof
- text: Overflow along an entire run, rather than at one obvious blockage point somewhere specific, more often points
    to an undersized or poorly pitched gutter than to simple debris buildup. It is worth distinguishing from a local
    blockage because the fix, and the eventual cost, are genuinely quite different depending on which one you actually
    have.
  title: A gutter overflowing its full length
- text: Fixings that should be covered by the course above showing through instead, rather than sitting properly
    hidden beneath it, are a common and fairly reliable point of future leaks. Each exposed nail head is effectively
    a small hole in an otherwise continuous surface, and it is worth flagging even where nothing has actually leaked
    yet.
  title: Nail heads showing on the surface
- text: If someone who worked on your roof before was reluctant to show you what they actually found or walk you
    through their reasoning at the time, that reluctance is itself genuinely informative. A confident, careful diagnosis
    is usually one somebody is happy to explain properly. One that avoids the conversation may have been more guess
    than genuine finding.
  title: A contractor unwilling to explain
- text: A change in smell, without anything visibly different yet to point at, is often an earlier warning than
    a stain, because moisture and material breakdown can be detectable before they produce anything you could actually
    see with your own eyes. Easy to dismiss because there is nothing concrete to point at, and genuinely worth mentioning
    anyway.
  title: An attic smelling different
- text: A visible sag specifically at the ridge, rather than across the general field of the roof, often points
    to something structural happening in the framing beneath it rather than a simple covering issue on the surface.
    It is one of the signs genuinely worth having looked at sooner rather than filed away for some point later.
  title: A dip along the ridge board
- text: If you have had contradictory opinions from different people about the exact same roof, that disagreement
    is informative on its own — it usually means at least one of them, quite possibly both, did not spend enough
    time actually looking before reaching a conclusion. Worth getting a third opinion focused specifically on the
    actual evidence rather than confidence alone.
  title: Two roofers, two different answers
- text: Bubbles or blisters forming on a flat or low-slope covering usually mean trapped moisture or air sitting
    beneath the surface, which will eventually work its way toward a weak point and let water through there instead.
    It is worth flagging even where the roof is not currently leaking anywhere visible yet. Pressing gently on a
    blister to see if it gives is a reasonable first check before calling anyone out.
  title: A membrane blistering underfoot
- text: Give or bounce felt underfoot during an inspection, in an area that used to feel genuinely solid, often
    means the timber underneath has softened from sustained moisture exposure over time. It is one of the more useful
    things a roofer checks physically rather than simply visually, and it changes the likely scope of work considerably.
  title: A batten flexing underfoot
- text: A covering that has quietly done its job for years without ever being properly looked at is not automatically
    hiding a problem underneath, but the absence of any record makes it harder to know how much life is genuinely
    left in it. Worth having a proper baseline assessment done before anything actually goes wrong unexpectedly.
  title: A roof never properly inspected
- text: Icicles forming heavily in one section of the eave and not others, rather than evenly along the whole length,
    often point toward an ice dam building specifically in that area, usually linked to uneven heat loss through
    the roof directly above it rather than to the weather alone. Worth photographing where they form, since the
    pattern itself is useful diagnostic information.
  title: Icicles forming unevenly
- text: A visible gap or separation where the skylight frame meets the roof deck is worth having checked properly
    rather than simply resealed on the surface, because sealant alone rarely addresses a curb that has genuinely
    shifted or deteriorated further underneath it over time. Worth mentioning specifically rather than folding it
    into a general complaint about the skylight leaking.
  title: A visible gap at a skylight curb
- text: If one valley collects noticeably more debris than the others on the same roof, it is often running at a
    shallower fall or catching runoff from a larger section above it, which makes it the most likely point for a
    future leak to actually start showing itself first. Worth clearing regularly if you can reach it safely, while
    the underlying cause gets properly assessed.
  title: One valley collecting more debris
- text: A change to the building nearby — an extension, a new structure, altered drainage — can affect how water
    moves across an existing roof in ways that only show up sometime afterward. Timing a new symptom against recent
    nearby work is a genuinely useful clue worth mentioning clearly on the phone call. Worth mentioning the exact
    dates of that nearby work when you call, since it helps narrow things down.
  title: Trouble after nearby building work
- text: A fascia that gives slightly under light pressure, rather than feeling properly solid, usually means water
    has been reaching it for a while now, often from a gutter that has stopped shedding water properly for some
    time. It is worth catching this before the softness spreads further along the whole run of fascia. Worth checking
    a few spots along the same run, since softness rarely stays confined to one point alone.
  title: A fascia that feels soft
- text: A tile at the ridge or hip that has visibly shifted out of line, or rocks noticeably when nudged gently
    by hand, has likely lost its bedding and is at genuine risk of coming free in the next strong wind that passes
    through. Worth acting on before it does rather than dealing with the aftermath.
  title: A hip or ridge tile sitting loose
- text: A stain that only appears in a particular spot after a particular kind of weather, rather than showing up
    randomly at other times, is a useful clue about where the water is actually entering the roof. The internal
    stain and the entry point are frequently several feet apart on a real roof, which surprises most people.
  title: A stain that follows a pattern
- text: On a flat or low-slope roof, seams that have begun to lift or separate at the edges are one of the more
    common failure points overall, because a membrane's weakest spots are almost always at its joints rather than
    across the plain, uninterrupted field of the surface itself. Worth checking after any particularly windy spell,
    since seams are usually where wind gets its first grip.
  title: Membrane seams lifting at the edges
- text: Isolated rust spots on a metal covering that has otherwise stayed clean elsewhere are worth having assessed
    properly rather than simply painted over on the surface, because rust often points to a coating failure or a
    spot where moisture is genuinely sitting rather than draining away as it should. Worth photographing and dating,
    so any change in the rust over time is easy to track properly.
  title: Rust patches on a metal roof
- text: The rubber or plastic collar around a vent pipe degrades faster than the surrounding covering does, particularly
    under direct sun exposure over time, and a cracked boot is one of the more common and easily missed sources
    of a small, slow leak that takes a while to actually show up indoors. Worth checking every pipe on the roof
    once one boot is found cracked, since they tend to age together.
  title: A cracked vent pipe boot
- text: Warping or waviness along an eave or rake edge, rather than a straight clean line running through, can indicate
    moisture trapped in the decking beneath the covering itself. It is worth checking properly before it is simply
    covered by a like-for-like repair that leaves the actual underlying cause completely untouched. Worth checking
    from a ladder rather than the ground, since warping is often clearer up close than from a distance.
  title: A warped roof edge
- text: A heating bill that has climbed noticeably without any real change in how the house is being used sometimes
    points to a ventilation or insulation gap at the roofline rather than anything else. Worth mentioning if it
    coincides with any other sign on this list, since together they narrow the likely cause considerably faster.
    Worth comparing against the same period last year rather than the previous quarter alone, to rule out ordinary
    seasonal variation.
  title: A sudden jump in heating costs
- text: A temporary cover left in place well past when the permanent fix should genuinely have happened by now is
    worth revisiting properly, because a tarp is meant to buy time, not replace the actual work that still needs
    doing. It will not hold indefinitely against ongoing weather no matter how well it was first fitted.
  title: An old tarp still on the roof
- text: A slate visibly out of alignment with the row around it, even if it has not actually come loose entirely
    yet, usually means the fixing nail has failed already and it is genuinely a matter of time before it comes free
    completely. Worth having it reset before it becomes a piece on the lawn below.
  title: A slate slipped but not fallen
- text: Increased activity around a specific section of roofline can indicate a gap or opening large enough for
    nesting, which is worth investigating both for the roof's own sake and because the resulting debris can block
    ventilation and drainage in that area steadily over time. Worth noting exactly where the activity is concentrated,
    since that narrows down where any opening likely is.
  title: Unusual bird or insect activity
- text: Some granule loss immediately after a new shingle roof is installed is normal and expected as loose surface
    granules settle in properly. A heavy, ongoing loss well beyond the first season, by contrast, is worth having
    checked, since it may point to a manufacturing or installation issue rather than simple settling behaviour.
    Worth photographing a sample against a plain background so the volume is easy to judge properly later.
  title: Heavy granule loss after installation
- text: If one area of the covering stays visibly damp longer after rain than the surrounding sections around it,
    that is often a sign of poor drainage, blocked flow, or a slight structural low point collecting water where
    it should genuinely be running off cleanly instead. Worth marking the boundary of the slow-drying patch so any
    change in its size is easy to track.
  title: A section that dries slower
- text: A chalky white deposit appearing on masonry near where it meets the roof usually indicates moisture moving
    through the brick or mortar over time, which is worth tracing back to the flashing joint rather than treated
    as purely a cosmetic masonry issue on its own. Worth mentioning whether it appears mainly after wet weather
    or stays constant regardless of conditions.
  title: White staining near a chimney
- text: A new sound during windy weather, particularly a whistle or hum that was not there before, often points
    to a gap or lifted section somewhere in the covering that is letting air pass through in a way it genuinely
    should not. Worth noting when it started and how strong the wind needed to be for it to happen.
  title: A roof whistling in wind
- text: If a downpipe seems to carry far less water than the size of the roof feeding it would suggest during heavy
    rain, water is likely finding another route somewhere upstream of it. Worth tracing properly before assuming
    the downpipe itself is simply undersized for the job it is meant to do. Worth checking during genuinely heavy
    rain rather than a light shower, since the difference is clearer under real load.
  title: A downpipe running unusually dry
- text: A valley repaired only with a bead of sealant, rather than a proper lining replacement underneath, is a
    common shortcut that tends to fail again within a season or two of being done. Sealant was never designed to
    carry the actual volume of water a functioning valley genuinely handles over time. Worth asking specifically
    what is underneath the sealant before assuming the repair actually addressed the cause.
  title: A valley patched with sealant only
- text: If cracking has appeared around a flashing joint that was worked on before, it is worth checking whether
    the original repair addressed the actual movement or settlement causing it, rather than simply patching over
    the visible gap itself. The same crack tends to return otherwise, sooner rather than later. Worth photographing
    against the original repair record if you kept one, to see how the crack has actually moved.
  title: New cracking near old chimney work
- text: If a neighbouring property with a roof of similar age and construction is showing problems and yours is
    not yet, that is not automatically a guarantee yours is fine, since the same conditions and materials are usually
    present on both properties. Worth having a comparative look before simply assuming you have been lucky so far.
  title: A neighbour's identical roof struggling
- text: Grit, granules or fragments of covering material turning up mixed into the loft insulation itself, rather
    than just collecting in the gutters below, often means material is shedding from underneath a penetration or
    detail rather than from the general field of the roof. Worth tracing properly to its actual source. Worth checking
    a few other spots in the loft as well, since debris rarely settles in only one place.
  title: Debris found in the loft insulation
