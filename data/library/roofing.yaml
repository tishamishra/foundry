    fall straight down once it is inside.
  - It runs along rafters, follows the underside of the covering, tracks down a wall and appears somewhere that
    has nothing to do with where it got in. A stain above the kitchen in a {city} property routinely turns out to
    be a chimney flashing at the other end of the room, or an outlet two elevations away. Repair the ceiling and
    the stain comes back; repair the ceiling and the wrong slope and it comes back more slowly, which is worse,
    because it takes another year to prove the fix failed.
  - '{company} inspects the roof and the space beneath it before quoting[[ anywhere in {city} and {county}]], because
    the entry point and the symptom are frequently not in the same place.'
  - Call {phone} and say where the water is showing. That is where the process starts, not where it ends.
- paras:
  - Nothing about this is complicated, which is the point.
  - '{company} covers {city}[[ and the surrounding part of {county}]]. Somebody comes out, gets onto the roof rather
    than looking at it from the ground, checks the details where roofs actually fail — flashings, valleys, ridge,
    penetrations, the abutments where a lower roof meets a wall — and looks in the loft where there is one to look
    in.'
  - You then get photographs and a plain explanation of what was found, including the parts that are fine. If work
    is needed, the quote names what is included and, just as importantly, what would change the price and by how
    much. If work is not needed, that is the finding and there is no charge for hearing it.
  - Most roofing disputes are not about workmanship. They are about a price that moved and nobody saying in advance
    that it might.
- paras:
  - Storms make the phone ring in {city}, and the week after a storm is when most bad roofing decisions get made.
  - Damage feels urgent, the queue is long, and somebody knocking on the door with a ladder on the van seems like
    the fastest route out of it. Some of those callers are perfectly competent. Some of them price a full replacement
    for a job that needs two hours and a bag of fixings.
  - '{company} works across {city}[[ and {county}]] and handles storm calls in the order they need handling: making
    a property safe and dry first, assessing properly second, quoting third. An active leak is prioritised over
    an inspection, and you will be given a real position in the queue rather than a comfortable one.'
  - If insurance is involved, the photographs and written description you need for the claim come as part of the
    visit rather than as an extra.
- paras:
  - There is a version of this trade that sells fear, and it does well after bad weather.
  - '{company} works the other way round in {city}. The inspection exists to establish what is actually wrong, and
    a fair proportion of visits end with a recommendation to do nothing yet, watch a specific thing, and call back
    if it changes. A roof with four winters left in it does not need replacing this year, and being told so is the
    useful part of the service.'
  - The coverage area takes in {city}[[ and the neighbouring parts of {county}]][[, including {nearby}]]. It stays
    that size on purpose — a round you can service properly is worth more than a map you cannot.
  - Call {phone}, describe what you are seeing, and get a straight answer about whether it warrants a visit.
- paras:
  - Access shapes roofing prices in {city} more than most people expect, and it is worth understanding before comparing
    quotes.
  - A single-storey rear slope you can reach off a ladder is a different job from a three-storey front elevation
    that needs a scaffold, even when the actual repair is identical. So is a steep pitch where the crew has to work
    off staging rather than standing on the covering. When two quotes come back a long way apart, the difference
    is often not the work at all — it is that one of them has priced getting to it and the other has not.
  - '{company} lists access separately[[ across {city} and {county}]] so you can see what the difficulty costs and
    compare like with like.'
  - It also means that where two jobs share access — a chimney and the flashing around it, say — doing them together
    genuinely costs less than doing them a year apart.
- paras:
  - Flat roofs and pitched roofs fail differently, and {city} has plenty of both.
  - 'A pitched roof usually tells you it is struggling: something slips, something lifts, grit appears in the gutter.
    A flat roof over an extension or a dormer tends to fail silently at the upstand — the point where it turns up
    to meet a wall — and by the time it shows inside, the boards underneath have often been wet for a while.'
  - '{company} covers both[[ throughout {city} and {county}]]. On a flat roof the inspection concentrates on the
    details rather than the middle: upstands, outlets, laps and the junction with anything the roof meets. That
    is where the failures are, and that is why a fourth patch in the middle of the field never seems to fix it.'
  - If yours has been patched before, say so on the call. It changes what is worth looking at first.
- paras:
  - '{company} works in {city} on the assumption that you would rather understand your roof than simply be given
    a number for it.'
  - That means the inspection produces photographs and an explanation, not a verdict. Which details have failed,
    which are ageing normally, which are fine and will stay fine for years. Where a repair makes sense and where
    it is money you would spend twice.
  - It also means being explicit about uncertainty. Nobody can see through a covering to the boards below it, so
    a quote that depends on what is underneath says so, names the price if the deck needs work, and does not treat
    that as a surprise on the day.
  - The round covers {city}[[ and the surrounding part of {county}]][[, taking in {nearby}]]. Call {phone} and describe
    the problem in whatever words you have for it.
- paras:
  - Gutters cause a surprising share of the roof problems reported in {city}, and they are the cheapest thing on
    the building to put right.
  - A gutter that has dropped, blocked or pulled away sends water down the wall and back against the lowest course
    of the covering rather than away from it. Left alone through a winter it soaks fascia and rafter feet, and the
    repair stops being a gutter repair. The symptom people describe on the phone is almost always damp inside, not
    a gutter.
  - '{company} checks the drainage as part of any roof inspection[[ across {city} and {county}]], because ruling
    it in or out first is quick and it changes what the rest of the visit is looking for.'
  - Sometimes the whole answer is an hour's work at ground level. When it is, that is what gets quoted.
- paras:
  - Older properties in {city} need a different approach, and it is mostly about restraint.
  - 'Original coverings, lime mortar bedding, timber that has been in place for a century and is perfectly sound
    — none of it responds well to modern shortcuts, and a roof that has stood for that long usually needs the failed
    detail addressed rather than the whole thing modernised. Sealant over a failing valley is the classic example:
    it buys a season and hides the deterioration underneath it.'
  - '{company} works on both period and modern roofs[[ around {city} and {county}]], and the assessment starts from
    what the roof was built to do rather than from what would be quickest to install.'
  - Where a like-for-like repair is possible it is usually the right answer, and it is usually cheaper than the
    alternative being quoted elsewhere.
- paras:
  - The point of a local roofer is not sentiment. It is response time and accountability.
  - '{company} covers {city}[[ and the adjoining part of {county}]], close enough that a tarpaulin can go on the
    same evening when rain is forecast and close enough that coming back to check something is not a half-day round
    trip. Work that needs a second look gets one.'
  - It also means the same people who quoted are the people who turn up, and the person who answers {phone} knows
    the property from the last visit rather than reading it off a screen for the first time.
  - None of that guarantees good work by itself. It just removes the excuses that make bad work easy.
- paras:
  - 'Two things make a roof quote comparable: what is included, and what would change it.'
  - Most of the disputes that end up in complaints are not about the standard of the work. They are about a price
    that moved halfway through because something was found that nobody had mentioned might be there. Soft decking
    under an old covering is the usual one, and it is entirely predictable — not whether it will be there, but that
    it might be.
  - '{company} quotes work in {city}[[ and across {county}]] with the exclusions written down and the cost of the
    likely surprises named in advance. If the boards are sound, the quote is the price. If they are not, you already
    know the number.'
  - Call {phone} for a look at what you have got, and a written answer you can actually compare against the others.
- paras:
  - Moss and debris are the most over-sold problem in roofing and the most under-treated in the places that matter.
  - On most coverings a general growth of moss across the field is cosmetic and does not need the aggressive treatment
    doorstep callers around {city} like to quote for. What does matter is moss and leaf litter sitting in the valleys,
    around penetrations and in the gutters, where it holds water against details that only work if they are allowed
    to drain and dry.
  - '{company} clears what affects performance[[ throughout {city} and {county}]] and says plainly when the rest
    is appearance rather than risk.'
  - If someone has told you your roof is dangerous from the pavement, a second opinion from the roof itself costs
    very little.
- paras:
  - New-build and recent properties in {city} fail in their own particular way, and it is rarely the covering.
  - 'The material is young and the workmanship on the field is usually fine. What goes wrong is the details that
    were rushed at handover: a flashing dressed badly, a poorly formed junction where an extension meets the main
    roof, an outlet set slightly proud so it never quite drains, ventilation blocked by insulation pushed too far
    into the eaves.'
  - '{company} sees these across {city}[[ and out into {county}]], and they are almost always repairs rather than
    replacements — which is worth knowing before accepting a quote that starts from the covering.'
  - Bring any handover paperwork you still have to the visit. It occasionally saves a great deal of time.
- paras:
  - Condensation and leaks look identical from inside, and telling them apart saves people a lot of money in {city}.
  - Water appearing on a bedroom ceiling in winter is not always coming through the roof. Blocked eaves ventilation,
    insulation stuffed hard into the corners, or a bathroom extractor venting into the loft instead of out through
    it will all produce damp patches, black spotting on the timbers and a smell of wet — with a completely watertight
    covering above.
  - '{company} looks in the loft as well as on the roof[[ anywhere in {city} and {county}]], because the difference
    between the two decides whether you need a roofer at all.'
  - It is a short check and it fairly regularly ends with a recommendation that costs nothing to act on.
- paras:
  - 'The order matters after damage: make it safe, make it dry, then find out what it needs.'
  - Those are three separate jobs and collapsing them into one is how people in {city} end up paying for a full
    replacement at the worst possible moment. Sheeting a damaged area is not a repair and is not priced as one;
    it buys the time to assess properly rather than under a deadline set by the weather forecast.
  - '{company} works that sequence across {city}[[ and {county}]]. Emergency attendance stops the damage getting
    worse. The proper assessment happens once the roof is dry enough to walk and read.'
  - Nobody will quote you for a new roof while your ceiling is still dripping. That is not the moment to be making
    a decision that size.
