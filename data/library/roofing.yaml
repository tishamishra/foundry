  - '{company} treats all of that as the job rather than as extras[[, throughout {city} and {county}]].'
- paras:
  - There is a version of {service_lower} that is sold on urgency, particularly in {city} after bad weather.
  - '{company} would rather sell it on diagnosis. The inspection establishes whether the work is needed now, needed
