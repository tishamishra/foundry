- paras:
  - Properties around {city} share their construction, and that means they share their weak points for {service_lower}.
  - The same junction detail, the same abutment where an extension meets the main roof, the same exposed elevation
    taking the same wind-driven rain. Having seen the pattern repeatedly shortens the inspection considerably, which
