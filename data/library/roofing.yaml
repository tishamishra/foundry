hero_intros:
- '{company} handles roof repairs, replacements and storm damage[[ across {city}, {state}]]. Somebody comes out,
  gets on the roof, and tells you what is actually wrong before anyone talks about money.'
- A roof rarely fails all at once. It fails at a flashing, a valley or a run of nails, and it fails quietly until
  a ceiling stains. {company} finds the point of failure[[ in {city}]] and fixes it in proportion to the damage.
- Most roofing calls[[ around {city}]] are not emergencies and do not need a new roof. {company} will tell you which
  yours is, in plain language, on the phone or in writing.
- If water is getting in, the first job is finding where. {company} works through the roof properly[[ across {county}]]
  rather than guessing from the driveway, and quotes only after there is something to quote on.
- '{company} covers repair, replacement, storm damage and gutters[[ for {city} property owners]]. One crew, one
  point of contact, and a written record of what was found and what was done.'
- Roofs are unglamorous until they leak. {company} keeps them boring — spotting the flashing that is about to go
  before it takes a ceiling with it[[ in {city}]].
- Call {company} on {phone} and describe what you are seeing. Half the time it can be narrowed down before anyone
  drives out, which saves you a visit and us a wasted morning.
- '{company} works on pitched and low-slope roofs[[ throughout {city} and nearby {nearby}]]. The assessment comes
  first, in writing, and it stands whether or not you use us for the work.'
- Storms make roofers busy and homeowners anxious, which is a poor combination. {company} works through jobs in
  order of how much water is getting in, and says so honestly when yours can wait.
- There is a version of every roofing job that costs less and lasts almost as long, and a version that costs more
  and is genuinely worth it. {company} will show you both[[ for your {city} property]].
- Roof problems are rarely where they appear. {company} finds the actual entry point, photographs it, and quotes
  for that — rather than for whatever would be most profitable to replace.
- Somebody gets on the roof, looks properly, and tells you what is wrong in plain words. If it is a two-hour repair,
  that is what gets quoted. Call {phone}.
- A written quote with its exclusions stated, after an inspection rather than a glance from the drive. That is the
  whole offer, and it removes most of the arguments this trade generates.
- '{company} repairs roofs[[ across {city} and the surrounding area]], and regularly recommends doing nothing yet.
  A covering with four winters left in it does not need replacing this year.'
- Water tracks along timbers before it shows itself, so the stain and the fault are often at opposite ends of the
  room. Finding which is which is the job. Call {phone}.
- Leaks, slipped material, failed flashings, valleys that have been sealed over rather than rebuilt. Diagnosed from
  the roof, photographed, and priced for what was actually found.
- 'Storm damage handled in the right order: made safe, made dry, then assessed once the roof can be walked. Nobody
  will quote you a new roof while the ceiling is still dripping.'
- You cannot inspect work carried out above head height and then covered over. So every stage is photographed and
  the pictures come with the invoice, whether or not you ask.
- Access priced as its own line, so two quotes can be compared honestly. Most of the gap between roofing prices
  is scaffold, not skill.
- '{company} answers its own phone, and the person answering has usually been on a roof that day. Call {phone} and
  describe what you are seeing.'
- If your roof is fine, that is a finding rather than a wasted visit — and a decent share of inspections here end
  exactly there.
- Repairs where repairs will do, replacement when repairs have stopped holding, and a clear explanation of which
  situation you are in before any price is discussed.
- A quote that states what is included, what is not, and what would change the number. If the deck is sound the
  quote is the price; if it is not, you already knew the figure.
- Someone knocked and told you the roof is dangerous? A look from the roof itself costs very little, and sometimes
  confirms that the first quote was fair.
- Gutters, ventilation and condensation cause a large share of what gets reported as roof leaks. Ruling them in
  or out first is quick, and occasionally it is the entire answer.
- The same construction repeats across a neighbourhood, and so do the failures. Having seen the pattern shortens
  the search and keeps exploratory time off the bill.
- Flashings, valleys, ridge and penetrations. Roofs fail at their junctions far more often than across their fields,
  which is where the inspection starts.
- Written findings, dated photographs, and damage descriptions in the form insurers ask for — produced as part of
  the visit rather than as a chargeable extra.
location_intros:
