- paras:
  - '{service} on an older property in {city} is mostly an exercise in restraint.'
  - Original materials and traditional detailing generally want a like-for-like repair rather than a modern substitute,
    and a roof that has stood a century usually needs its failed detail addressed rather than the whole thing brought
    up to date. Sealant over a failing valley buys a season and hides what is happening underneath.
  - '{company} assesses from what the roof was built to do[[ across {city} and {county}]], and where a traditional
    repair is possible it is usually both correct and cheaper.'
- paras:
  - The commonest reason {service_lower} has to be done twice is that the first attempt treated the symptom.
  - Water travels along timbers and under coverings before it shows itself, so the stain on a {city} ceiling and
    the fault letting water in are often at opposite ends of the room. Repairing where the stain is produces a fix
    that appears to work until the next sustained rain.
  - '{company} traces the path before pricing the repair. It takes longer on the day and it is the reason the work
    holds.'
- paras:
  - If insurance is involved in your {service_lower}, the paperwork is part of the visit.
  - Dated photographs, a written description of the damage in the form insurers expect, and a breakdown that separates
    making safe from permanent repair. {company} produces it as standard[[ throughout {city} and {county}]] rather
