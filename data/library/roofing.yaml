why_us:
- text: The commonest expensive mistake in roofing is fixing the wrong thing well. We find the entry point first.
  title: Diagnosis before pricing
- text: A failed flashing is a flashing job. It stops being one only when the deck underneath has gone, and we will
    show you if it has.
  title: Proportionate repairs
- text: What is included, what is excluded, and what would change the price. Ambiguity in a quote always resolves
    in the contractor's favour, so we remove it.
  title: Scope in writing
- text: You get pictures from the roof before and after. Nobody should have to take a roofer's word about a surface
    they cannot see.
  title: Photographs of the problem
- text: The same people start and finish. Handovers are where details get dropped and details are the whole job.
  title: One crew per job
- text: We would rather tell you the honest week than the flattering day and then miss it.
  title: Realistic timescales
- text: Nail sweeps, protected planting, skip placed where it does not block a neighbour. Small things, noticed
    by everyone.
  title: Tidy working
- text: If your roof has five years left, that is what you will hear, along with what those five years will likely
    need.
  title: Straight answers about age
- text: 'After storm work we write it up the way an adjuster needs to read it: dated, photographed and specific
    about cause.'
  title: Insurance-ready documentation
- text: You are told up front who will be on your roof and who they work for.
  title: No subcontracting surprises
- text: A number that a person answers, for the duration of the job, not a form that generates a ticket.
  title: Reachable while it runs
- text: Some jobs need a structural engineer, not a roofer. Sending you to one costs us a job and saves you a much
    bigger problem.
  title: We say no
- text: A stained ceiling feels like an emergency. Often it is a morning's work, and you should hear that even though
    the bigger job pays better.
  title: We price the scope, not the panic
- text: Every quote states what would change the price. Ambiguity always resolves in the contractor's favour, so
    we remove it up front.
  title: The quote names its exclusions
- text: We do not open a roof we cannot close the same day. Dates move when the forecast says they should, and you
    hear it early.
  title: Weather beats the calendar
- text: Handovers are where details get dropped, and on a roof the details are the entire job.
  title: The same crew start to finish
- text: If something else caught our eye, you get told and photographed, with no quote attached. You decide when.
  title: We flag what we are not pricing
- text: Findings, photographs, materials and dates. It is what an insurer wants and what the next roofer will need.
  title: Documented, not just done
- text: A number given from the driveway is a guess wearing a decimal point, not a real assessment of anything.
    Before we price a thing, somebody climbs up and checks the covering, the flashings and the penetrations, then
    comes back down with an actual list of what is wrong and why. That list is what gets priced, not an impression
    formed from the lawn, which is why our quotes tend to survive contact with the actual work once it starts.
  title: Roof inspected before quoting
- text: You should not have to take a stranger's word about a surface you cannot see for yourself. Whatever we find
    on your roof gets photographed before we touch it, so the quote is built on evidence you can look at directly
    rather than a description you are simply asked to trust. The same photographs come back with the invoice, showing
    plainly what changed between the two visits and why.
  title: Every finding photographed
- text: The easiest sale in this trade is a full replacement pitched at someone whose actual problem is a single
    failed flashing. We would rather tell you the smaller, less profitable truth, because the alternative costs
    us the relationship the day you eventually find out. Plenty of the roofs we inspect leave with a repair recommendation
    and genuinely nothing more attached to it.
  title: We won't oversell a replacement
- text: Nobody can properly see the deck until the old covering has actually come off it, so pricing it in advance
    is pretending to a certainty nobody honestly has. Our quotes state plainly that deck condition is unknown until
    it is exposed, along with a rough sense of what a soft section would add to the number. That makes the figure
    you are given honest rather than simply optimistic.
  title: Deck named as an exclusion
- text: If something turns up once the covering is stripped back that nobody could reasonably have seen beforehand,
    you get a call, a photograph, and a price before anything more happens to your roof. Nothing gets quietly absorbed
    into the job just to avoid an awkward conversation on the day. It is slower than pushing on regardless, and
    it is genuinely the only way a scope stays honest.
  title: Mid-job finds get shown
- text: A roof exposed to rain overnight is a roof that has failed on our watch, not on yours. If the forecast turns
    against a planned start, the date moves and you hear about it as early as we know ourselves, rather than discovering
    an empty driveway on the actual morning. Dates shift for weather more often than most people expect, and that
    is entirely deliberate on our part.
  title: No work in bad weather
- text: Roofing work spreads further than the boundary of the house it is actually happening on. Skips, scaffold
    and delivery vehicles get placed with the street in mind, not just the job itself, and anything that might affect
    a neighbour is agreed with everyone involved before it happens, not discovered by them on the morning it does.
    Good manners here are also, quite simply, good practice.
  title: Neighbour's driveway protected too
- text: Loose fixings from a tear-off end up scattered in grass, gravel and driveways whether anyone intends it
    or not, and a single nail in a tyre is a poor way to remember a roofing job afterward. A magnet sweep of the
    whole working area is part of every clear-up we do, not an optional extra offered only on request. It happens
    before the site is called finished, without fail.
  title: Magnet sweep before we leave
- text: Laying a new covering over an old one is sometimes a genuinely reasonable choice and sometimes a way of
    quietly hiding a problem underneath a second layer of material. We will tell you plainly which situation your
    roof is actually in, including the cases where a layover would save money now and cost considerably more later.
    The decision stays yours, made with full information rather than a sales angle.
  title: Tear-off versus layover explained
- text: A roof with real life left in it does not need replacing simply because a flashing failed at one corner
    of it. We say so plainly even when the bigger job would pay us better, because a customer who trusted us on
    a small job is worth more over time than one who paid for a large job they never strictly needed in the first
    place.
  title: We say when repair is enough
- text: Poor attic ventilation shortens the life of a covering quietly, from underneath, long before anything visible
    shows on the surface itself. Rather than assuming the venting is adequate simply because the roof looks fine
    from outside, we check airflow, balance and any moisture staining on the underside of the deck. We will tell
    you plainly if that is genuinely where the real problem actually sits.
  title: Ventilation checked, not assumed
- text: Scraping moss off aggressively can damage a covering more than the moss itself ever would, particularly
    on an older or more brittle roof. We will tell you honestly whether yours is cosmetic and safe to leave for
    now, or genuinely holding enough moisture to be shortening the roof's remaining life. That is a more useful
    answer than the reflexive, more expensive one most people expect to hear.
  title: Moss assessed, not stripped blindly
- text: Most skylight leaks have nothing to do with the glazing itself and almost everything to do with the flashing
    and curb fitted around it. We check that particular joint specifically rather than assuming a clean pane of
    glass automatically means a sound installation underneath it. The two are frequently unrelated, and the flashing
    is where water genuinely tends to get in first.
  title: Skylight flashing checked properly
- text: Chimneys, walls, valleys and skylights are where most roof leaks actually start, and they are also the details
    easiest to skip entirely during a rushed inspection. Every flashing point we assess gets photographed exactly
    as it is found, before anything is touched, so you can see precisely what condition it was in before we ever
    priced anything against it.
  title: Flashing photographed at every joint
- text: Old shingles, tiles, underlayment and battens all have to go somewhere once they come off, and working that
    out after the fact is exactly how quotes grow once the skip is already full. Disposal is priced into the original
    figure from the outset, not billed separately once the job is already well underway. The number you agreed to
    stays the number you actually pay.
  title: Disposal priced in from the start
- text: A roof rarely gets replaced entirely in isolation, and gutters and siding often need attention around the
    very same edges of the property. We plan the sequence with those other trades in mind before work ever starts,
    so nobody ends up undoing somebody else's finished work a week later. The whole job runs in the correct order
    the first time through.
  title: Sequenced with gutters and siding
- text: Some coverings and pitches simply are not safe to walk without specific precautions, and pretending otherwise
    to save an inspection fee is genuinely how people get hurt. Where a roof needs particular access equipment or
    cannot be walked conventionally at all, we say so plainly and price that access properly rather than cutting
    a corner nobody would notice until it went badly wrong.
  title: Honest about roof walkability
- text: An ice dam is not really a roofing problem on its own — it is a heat and ventilation problem that simply
    shows up as one on the surface. We explain plainly what is actually causing yours, which is sometimes a roofing
    fix and sometimes an attic insulation fix instead. That is a more useful answer than treating the symptom you
    called about as the entire story.
  title: Ice dams explained plainly
- text: Hail damage on shingles is easy to overstate and just as easy to miss entirely, depending heavily on who
    is looking and what they happen to be hoping to find. We check for actual bruising, granule loss and mat exposure
    rather than reading impact marks as damage on sight alone. We will tell you plainly when a roof has taken hail
    without needing anything done about it.
  title: Hail bruising properly assessed
- text: Lifted tabs and loose fixings at eaves, ridges and rakes are where wind does its first real damage, and
    they are genuinely easy to miss from the ground below. We check every edge specifically after a storm rather
    than only the section that looks obviously wrong from the driveway. A roof can be quietly failing at a corner
    nobody has noticed yet.
  title: Wind uplift checked at edges
- text: Every quote we write states its exclusions as clearly as it states its inclusions, because ambiguity in
    a written scope tends to resolve in the contractor's favour rather than yours. If something genuinely outside
    that scope turns up once work begins, you hear about it and see a price before anything happens, not discovered
    later on an invoice after the fact.
  title: Exclusions named in the quote
- text: A steep pitch changes how the crew can actually work, what equipment is genuinely needed, and how long a
    job realistically takes to complete safely. Pretending it does not is how timelines quietly slip and safety
    gets cut short somewhere along the way. We factor pitch honestly into both the price and the schedule, and explain
    plainly why a steep roof costs differently.
  title: Pitch drives method, honestly
- text: A roof problem often shows itself first from underneath, inside the loft, as a stain, a damp rafter, or
    a patch of daylight where there really should not be one. We check that space wherever it is safely accessible
    as a normal part of any inspection we carry out. The loft frequently tells you considerably more than the covering
    does from outside alone.
  title: Attic checked, not just roofline
- text: You get a specific list of exactly what will be done, in what order, and what it costs, before a single
    tool ever touches your roof. Nothing outside that agreed list happens without a proper conversation and a number
    attached to it first. That is genuinely the only real protection against a job that quietly grows once it is
    already underway on site.
  title: Written scope before work starts
- text: Stripping a covering back in fading light or worsening weather is exactly how corners get cut without anyone
    quite deciding to cut them on purpose. If a working day is running short, we would rather stop at a point the
    roof can genuinely be closed safely and finish it properly the next morning. Pushing on and gambling on the
    forecast is not a risk we take.
  title: No rushed tear-offs in poor light
- text: Everything a roof collects funnels through its valleys, which makes them the hardest-working detail on the
    entire covering and the most common place for a repair to quietly fail. We check valley lining, debris and fixings
    specifically, rather than treating them as simply part of the general surface. Valleys rarely behave the same
    way the rest of a roof does.
  title: Valleys inspected in detail
- text: Chimneys are where a large share of roof leaks genuinely begin, at the joint between the masonry and the
    covering rather than in the brickwork itself. That flashing gets assessed and priced as its own separate detail,
    apart from the general roof scope, so you can see exactly what condition it was in and precisely what putting
    it right will actually take.
  title: Chimney flashing priced separately
- text: Once a new covering goes on, the underlayment underneath disappears for the entire remaining life of the
    roof, which is exactly why we photograph it before it gets hidden. You see what was genuinely installed, not
    just a description of it typed onto an invoice afterward. That record sits alongside your other findings for
    whoever looks at this roof next.
  title: Underlayment photographed before covering
- text: A missing or damaged drip edge sends water back underneath the covering at the eave rather than clear of
    the fascia board below it, which is a common and often overlooked cause of rot along an entire roofline. We
    check it at every single eave as a routine matter of course, not only in spots where it is already visibly bent
    or missing.
  title: Drip edge checked at every eave
- text: Ridge and hip tiles rely on bedding and pointing that ages quite differently from the rest of the covering
    around them, and a crumbling ridge line is one of the more common causes of a slow, hard-to-place leak. We check
    bedding condition specifically rather than assuming the ridge is fine simply because the field of the roof still
    looks it from below.
  title: Ridge and hip bedding checked
- text: Pallets of tile, bundles of shingle and stacks of batten are heavy, and dropping them in the wrong spot
    can genuinely damage planting or paving that has nothing to do with the roof itself. Staging is planned with
    your garden specifically in mind before delivery, not worked out on the morning by whoever happens to be driving
    the lorry that day.
  title: Materials staged to protect your garden
- text: A tear-off has to close on the same day it opens, which means the whole schedule genuinely depends on a
    real, usable stretch of dry weather rather than a hopeful guess at one. We plan around an actual forecast and
    communicate honestly if that window narrows unexpectedly, rather than starting a job we might not actually be
    able to finish safely on time.
  title: Weather window planned properly
- text: The moment the old covering comes off and the deck is finally visible, you get told exactly what condition
    it is genuinely in, with photographs attached, and a price for any section that needs replacing before anything
    else continues. Nothing gets covered back over on the quiet assumption that you would rather not know about
    it.
  title: Deck condition shown before covering
- text: Soffit and fascia sit right at the edge of the roofing system, and a problem there often shows up looking
    like a roof symptom even though the covering itself is genuinely fine. We check both while we are already up
    there working, because leaving them out of the inspection just means someone finds the real cause later on,
    and more expensively.
  title: Soffit and fascia checked too
- text: Whatever gets opened during a working day gets closed and made properly watertight before the crew leaves,
    regardless of how far behind the schedule happens to be running that day. A roof left exposed overnight is a
    decision, not an accident, and it is one we simply do not make, even when it genuinely means a longer working
    day to get there.
  title: Roof never left open overnight
- text: Vent pipes, extractor outlets and any other penetration through the covering are common leak points precisely
    because they interrupt what would otherwise be a continuous surface entirely. Each one gets checked, sealed
    properly and noted in the written record, rather than treated as an afterthought once the main covering work
    has already been finished off.
  title: Penetrations sealed and documented
- text: The condition of the roof before anything is touched at all is useful evidence, particularly if there is
    any question of storm damage or a dispute with an insurer down the line. That record gets made before the first
    piece even comes off, not reconstructed later from memory, so it genuinely holds up to whoever needs to see
    it eventually.
  title: Old covering photographed first
- text: Flashing is where careful work matters most and where a rushed job is genuinely hardest to spot once it
    has already been dressed and sealed over. Somebody other than the person who did the original work checks it
    before the job is called finished, because the person closest to a detail is usually the last one to notice
    what they missed.
  title: Second check on flashing work
- text: Grit turning up in the gutters worries people, and sometimes it genuinely should, and sometimes it really
    should not. We explain plainly what your particular granule loss actually indicates given the roof's age and
    current condition, rather than either dismissing it outright or using it to justify a job the roof does not
    actually need doing at all.
  title: Granule loss explained honestly
- text: Resealing a skylight without checking the curb underneath it treats the symptom and leaves the actual cause
    sitting untouched, which is exactly why the leak usually comes back within a season or two. We check the curb,
    the flashing and the seal together, and tell you plainly which part is actually failing before anything gets
    patched over on top of it.
  title: Skylight curbs checked, not resealed
- text: Branches touching a roof keep the covering damp for longer, drop debris directly into valleys and gutters,
    and shorten the life of everything underneath them over time. We flag tree contact as part of the assessment
    even though it is genuinely not our work to carry out ourselves, because leaving it unmentioned would quietly
    undercut the repair we are about to price.
  title: Tree contact flagged before quoting
- text: Not everything on a roof needs replacing simply because it is old, and reusing what is genuinely sound is
    usually the largest saving available on a given job. The final record states plainly what was kept and what
    was actually replaced, so you can see exactly where the money went rather than simply assuming everything on
    the invoice was new.
  title: Written note on reuse
- text: Matching an existing covering exactly is sometimes genuinely straightforward and sometimes properly difficult,
    particularly on an older or weathered roof that has faded unevenly over time. Where an exact match is not realistically
    available, we show you the closest option and exactly where the difference will actually be visible, before
    you commit to anything at all.
  title: Honest about matching your roof
- text: Where the scaffold goes, where materials get stacked, and how the skip gets placed are all worked out before
    the first van ever turns up, not improvised on the morning by whoever happens to arrive first. Planning it properly
    in advance is genuinely what keeps a driveway usable and a garden intact through a job that runs several days.
  title: Access planned before the crew arrives
- text: A photograph you send us can narrow down what we are likely to find on site, but it cannot replace an actual
    physical inspection, and pricing from images alone is exactly how quotes end up wrong in either direction. We
    use what you send us to prepare properly, then confirm everything on the roof itself before any number is finalised.
  title: No quoting from photos alone
- text: The person who climbed up and actually found the problem is the same person carrying out the fix, rather
    than a handover between an estimator and an unfamiliar crew turning up later. That continuity means fewer things
    get genuinely lost in translation between what was found on the roof and what actually gets done about it.
  title: Same crew inspects and works
- text: If something else catches our eye while we are already up there — a soft batten, a cracked tile two rows
    over — you get told about it and shown a clear photograph, with no quote attached unless you specifically ask
    for one yourself. You decide when, or genuinely whether, that becomes a job in its own right.
  title: Adjacent issues flagged, not sold
- text: The real test of any roofing repair is weather, not the day the crew happens to pack up and leave, so we
    check back after the first significant rainfall following the work itself. If anything is not behaving quite
    the way it should, that is the point it gets caught, rather than months later once the ceiling has already stained
    badly.
  title: Follow-up after heavy rain
- text: Insulation that has shifted, thinned, or gotten genuinely wet affects both energy use and roof ventilation,
    and it is easy to overlook entirely if the loft check gets treated as a mere formality. We note its condition
    alongside the roofing findings themselves, because the two are considerably more connected than most people
    generally expect them to be.
  title: Loft insulation checked too
- text: An honest sense of remaining service life is more useful to you than a sales pitch dressed up carefully
    as an assessment of your roof. If we genuinely think your roof has a reasonable number of years left in it,
    that is exactly what you hear, along with what those years will likely need from you along the way.
  title: Honest about remaining roof life
- text: A valley that has failed once tends to fail again in exactly the same place if the underlying lining was
    never properly addressed, rather than just the visible surface above it. We line valleys to a proper standard
    rather than patching the symptom on top, because a valley repair that does not hold costs more the second time
    around.
  title: Valleys lined properly, not patched
- text: Before the crew ever leaves, somebody walks the site with you specifically, pointing out exactly what changed
    and where, rather than assuming a tidy van driving off settles the matter on its own. It is a short conversation,
    and it is genuinely the point where most small questions get answered before they become a phone call weeks
    later.
  title: Walk-round happens every time
- text: What was installed, and roughly when it was installed, gets recorded and handed to you at the end of the
    job, in a form you can genuinely keep and file away. That record is useful for you, for any future buyer of
    the property, and for whoever eventually has to work out what is actually on your roof without climbing up.
  title: Materials recorded with a date
- text: If a spot has genuinely been patched before and the problem kept coming back regardless, the patch itself
    was never really the issue — something underneath it was still quietly doing the damage. We look specifically
    for signs of earlier repairs that did not solve the actual underlying cause, rather than simply adding another
    layer on top of one that already failed.
  title: We check for repairs that failed
- text: A cracked or discoloured tile can look genuinely alarming and mean very little at all, while a subtle sag
    along a rafter line can mean considerably more than it first appears to on the surface. We explain plainly which
    category what you are actually seeing falls into, so you are never left guessing between a cosmetic detail and
    a real structural concern.
  title: Cosmetic versus structural, explained
- text: Some roof problems are actually structural problems wearing a roofing symptom on top of them, and taking
    them on as a straightforward roofing job would mean doing them considerably worse than they genuinely need.
    Sending you to an engineer instead costs us the work entirely and saves you a much larger problem further down
    the line.
  title: We'll send you to an engineer
- text: A skip parked without thinking about sightlines, bin day, or a shared driveway causes friction that genuinely
    has nothing to do with the actual roofing work itself. We think about exactly where it goes before it ever arrives,
    with your street in mind as well as your own access, so the job does not become a source of neighbourly tension.
  title: Skip placed with neighbours in mind
- text: Anywhere a roof meets a wall is a joint, and joints are where roofs fail more often than anywhere else on
    the covering itself. We check every single abutment specifically, rather than only the ones sitting near an
    active complaint, because the next leak often starts at a joint nobody had thought to look at yet.
  title: Every wall abutment checked
- text: An inspection is considerably more useful when it looks forward as well as back at what has already happened.
    Alongside what genuinely needs doing now, you get a realistic sense of what is likely to need attention over
    the next few years, so you can plan and budget for it properly rather than being caught out by surprise.
  title: Honest about the next five years
- text: The scope we price matches exactly what the inspection actually found, not the largest job we could plausibly
    justify charging for. A single failed flashing gets priced as a flashing job, full stop. It only becomes something
    larger when the evidence on the roof genuinely says so, and we will show you that evidence first.
  title: Scope matches the evidence
- text: Ground-level photographs show you the overall picture and any obvious symptoms visible from the street,
    while roof-level photographs show the actual detail we are pricing against directly. Together they give you
    a considerably fuller view than either could alone, and they mean you are agreeing to a scope you can genuinely
    see rather than one you are simply asked to imagine.
  title: Roof photographed ground and above
- text: Having vents installed does not automatically mean a roof is ventilating properly at all — intake and exhaust
    genuinely have to balance for airflow to actually work as intended. We check the balance itself, not just whether
    vents are technically present, because a roof with plenty of vents can still be trapping moisture if the airflow
    through it is genuinely wrong.
  title: Ventilation balance checked properly
- text: Where old materials actually end up going, and exactly how they are disposed of, gets stated plainly in
    writing rather than left as a vague assumption on either side. It sounds like a small detail until the specific
    moment you need to know it, at which point having it already documented saves an awkward conversation nobody
    actually wants to have retroactively.
  title: Disposal method named in writing
- text: If soft or rotten timber is found once the covering comes off, it gets photographed, priced separately,
    and discussed with you before it is ever closed back up again, never simply covered over on the hope that nobody
    checks. Covering rot instead of properly treating it just moves the real cost onto whoever happens to discover
    it next.
  title: Rot never covered quietly
- text: Not everything an inspection turns up genuinely needs immediate action, and telling you that plainly is
    just as much a part of the job as pricing what actually does need doing. You get a written note of anything
    we think is genuinely safe to leave for now, along with a rough sense of when it is worth revisiting properly.
  title: Written note on what to leave alone
- text: Since a roofing crew is already on site with proper access set up, checking the gutters at the same time
    costs almost nothing extra and often catches the actual cause of a symptom that only looked like a roof leak.
    What looks like a roof problem is frequently a gutter simply overflowing behind a fascia, and it is worth ruling
    out together.
  title: Gutters checked while we're up
- text: Hail can leave marks that look genuinely dramatic and mean very little, or marks that look fairly minor
    and mean quite a lot, depending heavily on the covering and the angle of impact involved. We assess it properly
    rather than reading the surface at a glance, and we will tell you plainly when a roof has genuinely taken damage
    worth pricing.
  title: Honest verdict on hail damage
- text: Delivery vehicles, skips and scaffold all need somewhere sensible to go, and working that out before the
    job starts avoids a week of vehicles blocking your own access to your own property entirely. We plan around
    your driveway specifically, not around whatever happens to be most convenient for the crew on any given day.
    It is worth asking about specifically before the first van shows up.
  title: Access planned around your driveway
- text: Once a scope is genuinely agreed in writing, the crew works to it, not to whatever seems easier once they
    are actually up there on the roof. If something genuinely needs to change, you are told and asked before it
    happens, which is the only way a written scope actually means anything at all once the work is underway.
  title: Scope stays what we agreed
- text: The drip edge sends water clear of the fascia rather than letting it creep back underneath the covering
    at the eave, and a damaged or missing run there is one of the more overlooked causes of slow rot along a roofline.
    We check it as a matter of course on every inspection, not only where it is visibly bent, and it gets photographed
    alongside everything else we find on your roof.
  title: We check the drip edge line
