directory:
  label: Directory
  shell: directory
  note: 'Index-first. The page is a browsable directory of areas and services rather than a brochure —
    a service matrix, an A-Z of covered places, and a compact marketing spine underneath. Built for the
    long tail: every cell is a real internal link, which is what stops a 26,000-page site from being 25,000
    orphans.'
  page_sections:
    home:
    - hero_compact
    - intro_split
