# What every site shares. One edit here moves every site at once.
# How many blocks each page shows. These drive BOTH the renderer and the
# capacity calculation, so the number you see on the Library page is the number
# the build actually consumes.
counts:
  trust: 4
  why_us: 6
  process: 4
  faqs: 6
  reviews: 3
  service_faqs: 3
  service_bullets: 4
  location_faqs: 3
  location_reviews: 2
  signs: 6
  compare_rows: 5
  cost_factors: 5

# The section order for each page type.
#
# A section list may REPEAT an entry — `cta` appears twice on the money pages,
# once after the offer and once after the objection handling. That is a
# conversion decision living in data rather than in code, and it works for free
# because sections are stateless.
page_sections:
  home:             [header, hero, trust, services_grid, why_us, process, reviews, areas_teaser, faq, cta, footer]
  about:            [header, page_head, about_body, why_us, trust, cta, footer]
  contact:          [header, page_head, contact_body, cta, footer]
  services:         [header, page_head, services_grid, why_us, process, cta, footer]
  areas:            [header, page_head, areas_list, cta, footer]
  county:           [header, page_head, county_body, services_grid, cta, footer]
  service:          [header, hero, trust, service_body, why_us, cta, process, reviews, faq, cta, footer]
  location:         [header, hero, trust, location_body, services_grid, why_us, reviews, faq, cta, footer]
  location_service: [header, hero, trust, location_service_body, cta, process, why_us, reviews, faq, cta, footer]
  default:          [header, page_head, cta, footer]

footer:
  disclaimer: >-
    {company} is an independent contractor serving the areas listed on this site.
    Service availability, scheduling and pricing depend on the job and the
    location. Nothing on this page is a quote.
