{% extends "base.html" %}{% block body %}
<div class="card narrow center">
  <h1>Foundry</h1>
  <p class="sub">Local admin panel. Nothing here is reachable from the internet.</p>
  <form method="post">
    <label>Password<input type="password" name="password" autofocus></label>
    <button class="btn full">Sign in</button>
  </form>
  {% if default %}<p class="note warn-text">The password is still the default (<code>admin</code>).
  Set <code>FOUNDRY_PASSWORD</code> before you put anything real in here.</p>{% endif %}
</div>
{% endblock %}
